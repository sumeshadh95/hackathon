<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0c0f">
<title>Korjaa</title>
<style>
:root { --bg:#0a0c0f; --surface:#14181e; --raised:#1d232b; --line:#2b323c; --text:#f7f5f0; --dim:#a9b1bb;
  --amber:#ffb020; --amber-soft:#2b210d; --on-amber:#1a1200; --red:#e5343a; --red-soft:#2c1215; --green:#3ddc84; --green-soft:#10281b; --on-green:#06210f;
  --tap:64px; --radius:20px; --font:"Segoe UI Variable Display","Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif; }
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
[hidden] { display:none !important; }
html,body { height:100%; margin:0; overflow:hidden; background:var(--bg); color:var(--text); font:400 17px/1.45 var(--font); -webkit-font-smoothing:antialiased; }
button,input { font:inherit; color:inherit; }
button { min-height:var(--tap); padding:8px 10px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); font-weight:650; cursor:pointer; transition:transform .12s,background-color .15s,border-color .15s; }
button:hover { border-color:#47515e; }
button:active { transform:scale(.97); }
button:disabled { opacity:.35; cursor:not-allowed; transform:none; }
:focus-visible { outline:3px solid var(--text); outline-offset:2px; }
a { color:var(--amber); overflow-wrap:anywhere; }
svg { display:block; flex:none; }
.primary { border-color:var(--amber); background:var(--amber); color:var(--on-amber); font-weight:800; }
.primary:hover { border-color:#ffc555; background:#ffc555; }
.success { border-color:var(--green); background:var(--green); color:var(--on-green); font-weight:800; }
.wide { grid-column:1 / -1; }

.app { display:flex; flex-direction:column; height:100dvh; max-width:760px; margin:auto; padding:max(10px,env(safe-area-inset-top)) 14px max(12px,env(safe-area-inset-bottom)); gap:10px; }
header { flex:none; display:flex; align-items:center; gap:8px; }
.brand { margin-right:auto; color:var(--text); font-size:21px; font-weight:750; letter-spacing:-.02em; }
.brand i { color:var(--amber); font-style:normal; }
#newTask { min-height:48px; padding:0 12px; border-radius:14px; color:var(--dim); font-size:14px; }
#stop { display:inline-flex; align-items:center; gap:8px; min-width:104px; min-height:var(--tap); padding:0 16px; border:0; border-radius:999px; background:var(--red); color:#fff; font-weight:850; letter-spacing:.06em; }
#stop:hover { background:#f24a50; }
#stop i { width:12px; height:12px; border-radius:3px; background:#fff; }
.stage { flex:1; min-height:0; display:flex; flex-direction:column; gap:10px; }
.reading { flex:1; min-height:0; display:flex; flex-direction:column; gap:8px; }
.dock-area { flex:none; display:flex; flex-direction:column; gap:8px; }

#progress { flex:none; }
.progress-label { display:flex; justify-content:space-between; gap:12px; margin-bottom:6px; color:var(--dim); font-size:15px; font-weight:650; }
.progress-label span:last-child { min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#segments { display:flex; gap:4px; }
#segments i { flex:1; height:7px; border-radius:4px; background:var(--raised); transition:background-color .3s; }
#segments i.on { background:var(--text); }
#progress.safety .progress-label span:first-child { color:var(--amber); }
#progress.safety #segments i.on { background:var(--amber); }

#main { flex:1; min-height:0; overflow-y:auto; overflow-x:clip; }
.eyebrow { margin:0 0 6px; color:var(--dim); font-size:15px; font-weight:650; }
#step { margin:0; max-width:17em; font-size:clamp(34px,10.5vw,44px); line-height:1.13; font-weight:720; letter-spacing:-.025em; overflow-wrap:anywhere; text-wrap:balance; animation:rise .3s ease; }
#step.medium { font-size:clamp(24px,7vw,30px); line-height:1.25; }
.hint { margin:10px 0 0; color:var(--dim); font-size:18px; }
.chips { display:grid; gap:8px; margin-top:18px; }
.chip { display:flex; align-items:center; justify-content:space-between; gap:12px; text-align:left; }
.chip svg { color:var(--amber); }
.uses { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
.uses span { padding:5px 12px; border:1px solid var(--line); border-radius:999px; color:var(--text); font-size:15px; font-weight:600; }
.note { margin-top:12px; padding:12px 14px; border-radius:16px; background:var(--raised); font-size:18px; }
details { margin-top:10px; border:1px solid var(--line); border-radius:16px; background:var(--surface); }
summary { display:flex; align-items:center; min-height:var(--tap); padding:0 16px; color:var(--text); font-weight:650; cursor:pointer; }
details > :not(summary) { margin:0 16px 14px; }
details ol { padding-left:22px; font-size:18px; }
details li + li { margin-top:6px; }
details a { display:block; }
figure { margin:12px 0 0; }
figure img { display:block; width:100%; max-height:280px; border-radius:16px; object-fit:contain; background:#000; }
figcaption { margin-top:6px; color:var(--dim); font-size:14px; }
.card { padding:16px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); }
.amber-card { margin-top:4px; border-color:var(--amber); background:var(--amber-soft); }
.amber-card h2 { display:flex; align-items:center; gap:10px; margin:0 0 8px; color:var(--amber); font-size:17px; }
.amber-card p { margin:0; font-size:clamp(24px,7vw,30px); line-height:1.25; font-weight:650; }
.amber-card ul { margin:0; padding-left:22px; font-size:19px; }
.amber-card li + li { margin-top:6px; }
.fix-card { border-color:var(--green); background:var(--green-soft); }
.fix-card strong { display:block; margin-bottom:6px; color:var(--green); }
.end { display:flex; flex-direction:column; align-items:flex-start; gap:12px; padding-top:8px; }
.seal { display:grid; place-items:center; width:84px; height:84px; border-radius:50%; animation:pop .35s ease; }
.seal.ok { background:var(--green); color:var(--on-green); }
.seal.no { background:var(--red); color:#fff; }
.seal.quiet { background:var(--raised); color:var(--amber); }
.end h1 { margin:0; font-size:clamp(30px,9vw,38px); line-height:1.15; letter-spacing:-.02em; }
.end p { margin:0; color:var(--dim); font-size:19px; }
.stop-card { border-color:var(--red); background:var(--red-soft); }
.stop-card p { color:var(--text); }

.item { display:flex; align-items:stretch; gap:8px; margin-top:8px; }
.tick { flex:1; min-width:0; display:flex; align-items:center; gap:12px; text-align:left; font-size:18px; }
.box { flex:none; display:grid; place-items:center; width:30px; height:30px; border:2px solid var(--dim); border-radius:9px; color:var(--on-green); font-weight:900; }
.tick[aria-pressed="true"] { border-color:var(--green); }
.tick[aria-pressed="true"] .box { border-color:var(--green); background:var(--green); animation:pop .2s ease; }
.tick[aria-pressed="true"] .box::before { content:"\2713"; }
.tick[aria-pressed="true"] .name { color:var(--dim); text-decoration:line-through; }
.need { flex:none; padding:0 12px; color:var(--amber); font-size:15px; }
.thumbs { display:flex; gap:8px; margin:12px 0; overflow-x:auto; }
.thumbs img { flex:none; width:84px; height:84px; border-radius:14px; object-fit:cover; }
.part { display:flex; align-items:center; gap:12px; padding:9px 0; border-top:1px solid var(--line); }
.part b { min-width:46px; color:var(--amber); font-size:18px; }
.part small { display:block; color:var(--dim); font-size:14px; }
.sk { height:16px; margin-top:12px; border-radius:8px; background:var(--raised); animation:fadepulse 1.6s infinite; }
.sk.short { width:60%; }
.foot { margin:14px 0 2px; color:var(--dim); font-size:13px; }

#captions { flex:none; min-height:26px; font-size:15px; }
#heard,#subtitle { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#heard { color:var(--text); font-weight:650; }
#subtitle { color:var(--dim); }
#error { color:#ff8f93; font-weight:650; }
#video { display:none; flex:none; width:100%; max-height:26vh; border-radius:18px; object-fit:cover; background:#000; }
#video.on { display:block; }
#controls { display:grid; gap:8px; }
.bar { display:grid; grid-template-columns:1fr 1.9fr 1fr var(--tap); gap:8px; }
.bar button { display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:6px 4px; font-size:14px; }
.icon-only { padding:0 !important; }
#camera-btn { position:relative; }
#camera-btn.on { border-color:var(--amber); color:var(--amber); }
.badge { position:absolute; top:-9px; left:50%; transform:translateX(-50%); padding:1px 7px; border-radius:999px; background:var(--amber); color:var(--on-amber); font-size:11px; font-weight:800; white-space:nowrap; }
#talk { position:relative; min-height:76px; border:0; background:var(--amber); color:var(--on-amber); font-size:17px; font-weight:800; }
#talk .bars,#talk .spin { display:none; }
.state-speaking #talk { background:var(--raised); color:var(--text); }
.state-speaking #talk .mic,.state-thinking #talk .mic,.state-listening #talk .mic { display:none; }
.state-speaking #talk .bars { display:flex; }
.state-thinking #talk { background:var(--raised); color:var(--text); }
.state-thinking #talk .spin { display:block; }
.state-listening #talk { background:var(--red); color:#fff; animation:ring 1.5s ease-out infinite; }
.state-listening #talk .mic2 { display:block; }
.mic2 { display:none; }
.bars { align-items:center; gap:3px; height:24px; }
.bars i { width:4px; height:8px; border-radius:2px; background:var(--amber); animation:wave .7s ease-in-out infinite; }
.bars i:nth-child(2) { animation-delay:.12s; } .bars i:nth-child(3) { animation-delay:.24s; } .bars i:nth-child(4) { animation-delay:.36s; }
.spin { width:24px; height:24px; border:3px solid var(--line); border-top-color:var(--amber); border-radius:50%; animation:turn .8s linear infinite; }
#typed { display:flex; gap:8px; }
#typed input { flex:1; min-width:0; min-height:var(--tap); padding:0 16px; border:1px solid var(--line); border-radius:var(--radius); background:var(--surface); font-size:18px; }
#typed button { min-width:84px; }

#sheet { position:fixed; left:0; right:0; top:calc(84px + env(safe-area-inset-top)); bottom:0; z-index:20; max-width:760px; margin:auto; padding:18px 16px max(18px,env(safe-area-inset-bottom)); overflow-y:auto; border-top:1px solid var(--line); border-radius:24px 24px 0 0; background:var(--surface); box-shadow:0 -18px 40px rgba(0,0,0,.6); animation:up .26s ease; }
.sheet-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
.sheet-head h2 { margin:0; font-size:24px; overflow-wrap:anywhere; }
.sheet-head button { min-width:84px; }
.option { padding:14px 0; border-top:1px solid var(--line); margin-top:14px; font-size:18px; }
.option small { display:block; color:var(--dim); font-size:14px; }
.option strong { display:block; }
.price { color:var(--green); font-weight:700; }
.open { display:flex; align-items:center; justify-content:center; min-height:var(--tap); margin-top:10px; border-radius:var(--radius); background:var(--amber); color:var(--on-amber); font-weight:800; text-decoration:none; }

#start { position:fixed; inset:0; z-index:30; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; padding:24px; background:var(--bg); text-align:center; }
#start h1 { margin:0; font-size:48px; font-weight:750; letter-spacing:-.03em; }
#start h1 i { color:var(--amber); font-style:normal; }
#start p { margin:0; max-width:26em; color:var(--dim); font-size:19px; }
#start button { width:100%; max-width:420px; min-height:92px; font-size:24px; box-shadow:0 0 40px rgba(255,176,32,.2); }
@keyframes rise { from { opacity:0; transform:translateY(10px); } }
@keyframes up { from { transform:translateY(100%); } }
@keyframes pop { 0% { transform:scale(.7); } 70% { transform:scale(1.08); } }
@keyframes wave { 50% { height:24px; } }
@keyframes turn { to { transform:rotate(360deg); } }
@keyframes ring { 0% { box-shadow:0 0 0 0 rgba(229,52,58,.55); } 100% { box-shadow:0 0 0 18px rgba(229,52,58,0); } }
@keyframes fadepulse { 50% { opacity:.45; } }
@media (orientation:landscape) and (max-height:520px) {
  .app { max-width:none; padding:6px max(12px,env(safe-area-inset-right)) 6px max(12px,env(safe-area-inset-left)); gap:6px; }
  .stage { flex-direction:row; gap:12px; }
  .reading { flex:1.25; min-width:0; }
  .dock-area { flex:1; min-width:0; justify-content:flex-end; }
  #step { font-size:30px; }
  #step.medium { font-size:23px; }
  #talk { min-height:var(--tap); }
  .wide-row { grid-template-columns:repeat(2,minmax(0,1fr)) !important; }
  #video { max-height:34vh; }
  #sheet { top:78px; }
}
@media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none !important; transition:none !important; } }
</style>
</head>
<body>
<div id="start">
  <h1>Korjaa<i>.</i></h1>
  <p>Hands-free help for repairs and real-world tasks. Tap once, then just talk.</p>
  <button id="start-btn" class="primary">Tap to begin</button>
</div>

<div id="app" class="app state-idle">
  <header>
    <div class="brand">Korjaa<i>.</i></div>
    <button id="newTask" hidden>New task</button>
    <button id="stop"><i aria-hidden="true"></i>STOP</button>
  </header>
  <div class="stage">
    <div class="reading">
      <div id="progress" hidden>
        <div class="progress-label"><span id="progressLabel"></span><span id="taskName"></span></div>
        <div id="segments" aria-hidden="true"></div>
      </div>
      <main id="main" aria-live="polite"></main>
      <div id="captions" aria-live="polite">
        <div id="heard" hidden></div>
        <div id="subtitle"></div>
        <div id="error" role="alert" hidden></div>
      </div>
    </div>
    <div class="dock-area">
      <video id="video" playsinline muted autoplay></video>
      <div id="controls"></div>
      <div class="bar">
        <button id="camera-btn"><span id="photoBadge" class="badge" hidden>Photo check</span>
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.6-2.5h6.8L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.4"/></svg>
          <span id="cameraLabel">Camera</span></button>
        <button id="talk">
          <svg class="mic" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg>
          <svg class="mic2" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/></svg>
          <span class="bars" aria-hidden="true"><i></i><i></i><i></i><i></i></span><span class="spin" aria-hidden="true"></span>
          <span id="talkLabel">Tap to talk</span></button>
        <button id="photos-btn">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="m3 16 5-4 4 3 3-2 6 4"/></svg>
          Photos</button>
        <button id="keyboard" class="icon-only" aria-label="Type instead" aria-expanded="false">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="6" width="19" height="12" rx="2.5"/><path d="M7 10v.01M11 10v.01M15 10v.01M18 10v.01M7 14h10"/></svg></button>
      </div>
      <form id="typed" hidden><input id="typed-text" aria-label="Type your message" placeholder="Type here" autocomplete="off"><button>Send</button></form>
    </div>
  </div>
</div>
<section id="sheet" aria-label="Where to buy" hidden></section>
<input id="photos" type="file" accept="image/*" multiple hidden>
<canvas id="snap" hidden></canvas>

<script>
const $ = id => document.getElementById(id);
const sessionId = crypto.randomUUID();
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const COMMAND_PHASES = ["caution", "items", "gate", "steps"];
const CHIPS = ["My kitchen sink is clogged", "Assemble a flat-pack shelf", "Make a sandwich with bread, cheese and tomato"];
const ARROW = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>';
const SHIELD = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3 5 6v5c0 4.6 2.9 8.2 7 10 4.100-1.800 7-5.400 7-10V6l-7-3Z"/></svg>';
const CHECK = '<svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12.500 4.600 4.600L19 7.600"/></svg>';
const CROSS = '<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>';
const state = { view:null, phase:"idle", busy:false, speaking:false, thumbs:[], pending:[], ticked:new Set(), planKey:"", gateIndex:0, lastStep:0 };
let audioCtx = null, source = null, recognizer = null, handsFree = !!Recognition, camStream = null, wakeLock = null;
let requestId = 0, speechId = 0, thinkTimer = null;

function el(tag, className, text, ...children) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  node.append(...children);
  return node;
}

function setError(text) { $("error").textContent = text || ""; $("error").hidden = !text; }
function setHeard(text) { $("heard").textContent = text ? `You: ${text}` : ""; $("heard").hidden = !text; }
function setSubtitle(text) { $("subtitle").textContent = text || ""; }

function updateTalk() {
  const voice = state.busy ? "thinking" : state.speaking ? "speaking" : recognizer ? "listening" : "idle";
  $("app").className = `app state-${voice}`;
  $("talkLabel").textContent = { thinking:"Thinking", speaking:"Speaking", listening:"Listening", idle:"Tap to talk" }[voice];
}

function unlockAudio() {
  const Ctx = window.AudioContext || window.webkitAudioContext;
  if (Ctx && !audioCtx) {
    audioCtx = new Ctx();
    const silent = audioCtx.createBufferSource();
    silent.buffer = audioCtx.createBuffer(1, 1, 22050);
    silent.connect(audioCtx.destination);
    silent.start(0);
    if (window.speechSynthesis) speechSynthesis.speak(new SpeechSynthesisUtterance(""));
  }
  if (audioCtx && audioCtx.state === "suspended") audioCtx.resume();
}

function silence() {
  speechId++;
  try { source?.stop(); } catch {}
  if (window.speechSynthesis) speechSynthesis.cancel();
  state.speaking = false;
  updateTalk();
}

function speakBrowser(text) {
  return new Promise(resolve => {
    if (!window.speechSynthesis) return resolve();
    const line = new SpeechSynthesisUtterance(text);
    line.rate = 0.95;
    line.onend = line.onerror = resolve;
    speechSynthesis.speak(line);
  });
}

async function speak(text) {
  if (!text) return;
  silence();
  const id = speechId;
  stopListening();
  state.speaking = true;
  setSubtitle(text);
  updateTalk();
  try {
    const response = await fetch("/api/tts", { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ text }) });
    if (!response.ok) throw new Error("tts");
    const audio = await audioCtx.decodeAudioData(await response.arrayBuffer());
    if (id !== speechId) return;
    await new Promise(resolve => {
      source = audioCtx.createBufferSource();
      source.buffer = audio;
      source.connect(audioCtx.destination);
      source.onended = resolve;
      source.start();
    });
  } catch {
    if (id !== speechId) return;
    await speakBrowser(text);
  }
  if (id !== speechId) return;
  state.speaking = false;
  updateTalk();
}

const commandPhase = () => COMMAND_PHASES.includes(state.phase);
const resumeListening = () => { if (handsFree && commandPhase()) listen(); };

function stopListening() {
  if (recognizer) { recognizer.onend = null; recognizer.abort(); recognizer = null; }
  updateTalk();
}

function listen() {
  if (!Recognition || recognizer || state.speaking || state.busy) return;
  const r = new Recognition();
  r.lang = "en-US";
  r.interimResults = false;
  r.maxAlternatives = 1;
  let failed = false;
  r.onresult = event => {
    const text = event.results[0][0].transcript;
    recognizer = null;
    r.onend = null;
    updateTalk();
    send(text);
  };
  r.onerror = event => {
    failed = true;
    if (["not-allowed", "service-not-allowed"].includes(event.error)) {
      handsFree = false;
      setError("Microphone blocked. Use the buttons or type.");
    }
  };
  r.onend = () => {
    recognizer = null;
    updateTalk();
    if (handsFree && commandPhase()) setTimeout(listen, failed ? 1200 : 250);
  };
  recognizer = r;
  try { r.start(); } catch { recognizer = null; }
  updateTalk();
}

function startThinking(messages) {
  let index = 0;
  clearInterval(thinkTimer);
  setSubtitle(messages[0]);
  thinkTimer = setInterval(() => { index = (index + 1) % messages.length; setSubtitle(messages[index]); }, 2800);
}

function showWaiting(messages) {
  $("progress").hidden = true;
  $("main").replaceChildren(el("h1", "", messages[0], ), el("div", "card", null, el("div", "sk"), el("div", "sk"), el("div", "sk short")));
  $("main").firstChild.id = "step";
  $("main").lastChild.style.marginTop = "18px";
  setControls(1, []);
}

async function request(path, body, messages, fullWait) {
  const id = ++requestId;
  stopListening();
  state.busy = true;
  setError("");
  updateTalk();
  startThinking(messages);
  if (fullWait) showWaiting(messages);
  try {
    const response = await fetch(path, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body) });
    if (!response.ok) throw new Error(path);
    const view = await response.json();
    if (id !== requestId) return;
    state.busy = false;
    clearInterval(thinkTimer);
    render(view);
    await speak(view.phase === "gate" ? gateLine(view) : view.say);
    if (view.action === "camera") return checkPart();
    resumeListening();
  } catch {
    if (id !== requestId) return;
    state.busy = false;
    state.pending = [];
    clearInterval(thinkTimer);
    setSubtitle("");
    if (state.view) render(state.view); else renderIdle({ say:"", screen:"", photo_count:0, seen_parts:[], product:"" });
    setError("Connection problem. Try again.");
    updateTalk();
  }
}

function messagesFor(text) {
  if (/\b(buy|find|missing|don'?t have|do not have)\b/i.test(text) && ["items", "gate", "steps"].includes(state.phase)) return ["Searching shops", "Comparing options"];
  if (["idle", "caution", "done", "stopped", "ended"].includes(state.phase)) return ["Finding instructions", "Checking safety advice", "Writing your steps"];
  return ["One moment"];
}

function sendRaw(text) {
  const urgent = ["stop", "start over"].includes(text);
  if (state.busy && !urgent) return setError("One moment, I'm still working on that.");
  unlockAudio();
  silence();
  const messages = urgent ? ["One moment"] : messagesFor(text);
  const longTask = !urgent && text !== "camera" && ["idle", "caution", "done", "stopped", "ended"].includes(state.phase);
  return request("/api/turn", { session_id:sessionId, text }, messages, longTask);
}

function send(text, label) {
  text = (text || "").trim();
  if (!text) return;
  if (state.busy && !["stop", "start over"].includes(text)) return setError("One moment, I'm still working on that.");
  setHeard(label || text);
  const shopping = /\b(buy|find|missing|don'?t have|do not have)\b/i.test(text);
  if (state.phase === "gate" && !shopping && /\b(done|next|ready|yes|okay|ok|confirm)\b/i.test(text)) return gateNext();
  return sendRaw(text);
}

function gateLine(view) {
  const item = view.safety[state.gateIndex] || view.safety[0];
  return `Safety check. ${item} Say done when that's sorted.`;
}

function gateNext() {
  const safety = state.view.safety;
  if (state.gateIndex >= safety.length - 1) return sendRaw("ready");
  state.gateIndex++;
  renderGate(state.view);
  speak(`${safety[state.gateIndex]} Say done when that's sorted.`).then(resumeListening);
}

function makeLink(label, url, className) {
  const link = el("a", className, label);
  if (/^https?:\/\//i.test(url)) link.href = url;
  link.target = "_blank";
  link.rel = "noopener noreferrer";
  return link;
}

function button(label, action, className = "", disabled = false) {
  const node = el("button", className, label);
  node.type = "button";
  node.disabled = disabled;
  node.onclick = typeof action === "function" ? action : () => send(action, label);
  return node;
}

function setControls(columns, buttons) {
  $("controls").style.gridTemplateColumns = `repeat(${columns}, minmax(0, 1fr))`;
  $("controls").classList.toggle("wide-row", columns === 4);
  $("controls").replaceChildren(...buttons);
  $("controls").hidden = !buttons.length;
}

function setProgress(kind, value, total, label, name) {
  $("progress").hidden = !kind;
  if (!kind) return;
  $("progress").className = kind;
  $("progressLabel").textContent = label;
  $("taskName").textContent = name || "";
  $("segments").replaceChildren(...Array.from({ length:total }, (_, index) => el("i", index < value ? "on" : "")));
}

function heading(text, medium) {
  const node = el("h1", medium ? "medium" : "", text);
  node.id = "step";
  return node;
}

function iconSeal(kind, svg) {
  const seal = el("div", `seal ${kind}`);
  seal.innerHTML = svg;
  return seal;
}

const foot = () => el("p", "foot", "AI steps can be wrong, so use your own judgement. Voice by ElevenLabs.");
const endControls = label => setControls(1, [button(label, newTask, "primary wide")]);

function syncThumbs(view) {
  if (state.pending.length && !view.say.startsWith("I couldn't")) state.thumbs = [...state.thumbs, ...state.pending];
  state.pending = [];
  state.thumbs = view.photo_count ? state.thumbs.slice(-view.photo_count) : [];
}

function render(view) {
  const previous = state.phase;
  state.view = view;
  state.phase = view.phase;
  if (view.phase === "gate" && previous !== "gate") state.gateIndex = 0;
  syncThumbs(view);
  if (view.shopping) renderShop(view.shopping);
  $("newTask").hidden = view.phase === "idle" && !view.photo_count;
  $("photoBadge").hidden = view.phase !== "steps";
  setSubtitle(view.phase === "gate" ? "" : view.say);
  ({ idle:renderIdle, caution:renderCaution, items:renderItems, gate:renderGate, steps:renderSteps, done:renderDone, stopped:renderStopped }[view.phase] || renderEnded)(view);
  if (["done", "stopped", "ended"].includes(view.phase)) { state.lastStep = 0; closeCamera(); }
  commandPhase() ? holdWakeLock() : releaseWakeLock();
  updateTalk();
}

function renderIdle(view) {
  setProgress();
  const nodes = [];
  if (view.photo_count) {
    nodes.push(el("p", "eyebrow", `${state.thumbs.length} of 6 photos`), heading(view.product || "Here's what I can see", true));
    nodes.push(el("div", "thumbs", null, ...state.thumbs.map(data => Object.assign(new Image(), { src:`data:image/jpeg;base64,${data}`, alt:"Your photo" }))));
    nodes.push(...view.seen_parts.map(part => el("div", "part", null, el("b", "", part.count === "unknown" ? "?" : `×${part.count}`), el("div", "", part.name, el("small", "", part.looks_like)))));
    setControls(1, [button("Guide me through this", `Help me with ${view.product || "the items in my photos"}`, "primary wide")]);
  } else {
    const chips = CHIPS.map(text => {
      const chip = button(text, text, "chip");
      chip.insertAdjacentHTML("beforeend", ARROW);
      return chip;
    });
    const failed = view.say && !view.say.startsWith("Okay.") ? el("p", "hint", view.say) : "";
    nodes.push(heading("What's wrong?"), el("p", "hint", "Tell me in your own words, or pick one."), el("div", "chips", null, ...chips));
    if (failed) nodes.splice(1, 1, failed);
    setControls(1, []);
  }
  nodes.push(foot());
  $("main").replaceChildren(...nodes);
}

function renderCaution(view) {
  setProgress();
  const card = el("div", "card amber-card");
  card.innerHTML = `<h2>${SHIELD}Before you start</h2>`;
  card.append(el("ul", "", null, ...(view.say.match(/[^.]+\./g) || [view.say]).map(line => el("li", "", line.trim()))));
  $("main").replaceChildren(card);
  setControls(2, [button("I understand the risk", "I understand the risk", "primary"), button("Use a repair shop", "no thanks")]);
}

function renderItems(view) {
  setProgress();
  const key = `${view.title}|${view.items.map(item => item.name).join("|")}`;
  if (key !== state.planKey) { state.planKey = key; state.ticked = new Set(); }
  const line = el("p", "hint");
  const update = () => { line.textContent = `${state.ticked.size} of ${view.items.length} ready. Missing something? Just say so.`; };
  const rows = view.items.map(item => {
    const tick = el("button", "tick", null, el("span", "box"), el("span", "name", item.name));
    tick.type = "button";
    tick.setAttribute("aria-pressed", state.ticked.has(item.name));
    tick.onclick = () => {
      const on = !state.ticked.has(item.name);
      on ? state.ticked.add(item.name) : state.ticked.delete(item.name);
      tick.setAttribute("aria-pressed", on);
      update();
    };
    const need = button("Need this?", `I need to buy ${item.name}`, "need");
    need.setAttribute("aria-label", `Find where to buy ${item.name}`);
    return el("div", "item", null, tick, need);
  });
  update();
  $("main").replaceChildren(el("p", "eyebrow", view.title), heading("Get these together", true), line, ...rows, foot());
  setControls(1, [button("Continue", "continue", "primary wide")]);
}

function renderGate(view) {
  const total = view.safety.length;
  setProgress("safety", state.gateIndex + 1, total, `Safety ${state.gateIndex + 1} of ${total}`, view.title);
  const card = el("div", "card amber-card");
  card.innerHTML = `<h2>${SHIELD}Check this first</h2>`;
  card.append(el("p", "", view.safety[state.gateIndex]));
  $("main").replaceChildren(card, foot());
  setControls(1, [button("Done ✓", gateNext, "primary wide")]);
}

function renderSteps(view) {
  setProgress("steps", view.step, view.total, `Step ${view.step} of ${view.total}`, view.title);
  if (view.check) {
    const card = el("div", "card fix-card", null, el("strong", "", "Did that fix it?"), heading(view.check, true));
    $("main").replaceChildren(card);
    return setControls(3, [button("Yes, it's fixed", "yes", "success"), button("No, keep going", "no"), button("Back to step", "back")]);
  }
  const nodes = [heading(view.screen)];
  if (view.uses.length) nodes.push(el("div", "uses", null, ...view.uses.map(text => el("span", "", text))));
  if (view.say && view.say !== view.screen && !view.shopping) nodes.push(el("div", "note", view.say));
  if (view.how.length) nodes.push(el("details", "", null, el("summary", "", "How to do it"), el("ol", "", null, ...view.how.map(text => el("li", "", text)))));
  if (view.image) {
    const image = Object.assign(new Image(), { src:view.image.url, alt:view.image.caption, referrerPolicy:"no-referrer", loading:"lazy" });
    const link = makeLink("", view.image.url);
    link.append(image);
    const figure = el("figure", "", null, link, el("figcaption", "", `${view.image.caption} Example image from ${view.image.source}. Compare it with your own item.`));
    image.onerror = () => figure.remove();
    nodes.push(figure);
  }
  if (view.detail) nodes.push(el("details", "", null, el("summary", "", "More detail"), el("p", "", view.detail)));
  if (view.sources.length) nodes.push(el("details", "", null, el("summary", "", "Sources"), el("div", "", null, ...view.sources.map(item => makeLink(item.title, item.url)))));
  nodes.push(foot());
  $("main").replaceChildren(...nodes);
  if (view.step !== state.lastStep) $("main").scrollTop = 0;
  state.lastStep = view.step;
  const buttons = [button("Back", "back", "", view.step === 1), button("Repeat", "repeat"), button("Stuck", "stuck"), button(view.step === view.total ? "Done ✓" : "Next", "next", "primary")];
  if (view.can_finish) buttons.push(button("It's fixed", "it's fixed", "wide"));
  setControls(4, buttons);
}

function renderDone(view) {
  setProgress();
  const skipped = view.skipped === 1 ? "1 step" : `${view.skipped} steps`;
  $("main").replaceChildren(el("div", "end", null, iconSeal("ok", CHECK), el("h1", "", "All done"), el("p", "", view.skipped ? `${view.title}. Fixed early, so you skipped ${skipped}.` : `${view.title}. Nicely finished.`)));
  endControls("Start another repair");
}

function renderStopped(view) {
  setProgress();
  $("main").replaceChildren(el("div", "end card stop-card", null, iconSeal("no", CROSS), el("h1", "", "Stopped"), el("p", "", view.say)));
  endControls("Start a new task");
}

function renderEnded(view) {
  setProgress();
  const declined = view.say.startsWith("Okay, I'll stop");
  const failed = view.say.startsWith("I couldn't build");
  if (declined || failed) {
    $("main").replaceChildren(el("div", "end", null, iconSeal("quiet", SHIELD), el("h1", "", declined ? "Good call" : "I couldn't build this one"), el("p", "", view.say)));
  } else {
    $("main").replaceChildren(el("div", "end card stop-card", null, iconSeal("no", CROSS), el("h1", "", "I won't guide this one"), el("p", "", view.say)));
  }
  endControls("Start a new task");
}

function renderShop(shopping) {
  const close = button("Close", closeShop);
  const options = shopping.options.map(option => {
    const box = el("div", "option", null, el("small", "", option.shop), el("strong", "", option.title));
    if (option.price) box.append(el("div", "price", `${option.price} (price shown on the page)`));
    if (option.why) box.append(el("small", "", option.why));
    box.append(makeLink("Open", option.url, "open"));
    return box;
  });
  $("sheet").replaceChildren(el("div", "sheet-head", null, el("h2", "", `Where to find ${shopping.item}`), close), ...options,
    el("details", "", null, el("summary", "", "How to buy it"), el("ol", "", null, ...shopping.buying_steps.map(text => el("li", "", text)))),
    el("details", "", null, el("summary", "", "Check before you order"), el("ol", "", null, ...shopping.checks.map(text => el("li", "", text)))),
    el("p", "foot", "Korjaa never places an order. You decide and buy on the shop's own page."));
  $("sheet").hidden = false;
  $("sheet").scrollTop = 0;
}

function closeShop() {
  $("sheet").hidden = true;
  $("sheet").replaceChildren();
}

async function openCamera() {
  if (camStream) return true;
  try {
    camStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment", width:{ ideal:1280 } }, audio:false });
  } catch {
    setError("Camera blocked or unavailable.");
    return false;
  }
  $("video").srcObject = camStream;
  $("video").classList.add("on");
  $("camera-btn").classList.add("on");
  $("cameraLabel").textContent = "Is this it?";
  await $("video").play().catch(() => {});
  return true;
}

function closeCamera() {
  if (!camStream) return;
  camStream.getTracks().forEach(track => track.stop());
  camStream = null;
  $("video").classList.remove("on");
  $("camera-btn").classList.remove("on");
  $("cameraLabel").textContent = "Camera";
}

async function checkPart() {
  if (state.busy) return;
  const wasOpen = !!camStream;
  if (!(await openCamera())) return;
  if (!wasOpen) await new Promise(resolve => setTimeout(resolve, 1200));
  const video = $("video"), canvas = $("snap");
  const scale = Math.min(1, 1024 / Math.max(video.videoWidth, video.videoHeight || 1));
  canvas.width = Math.round(video.videoWidth * scale);
  canvas.height = Math.round(video.videoHeight * scale);
  if (!canvas.width) return setError("Camera isn't ready. Try again.");
  canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
  const image = canvas.toDataURL("image/jpeg", 0.8).split(",")[1];
  if (state.phase === "idle") state.pending = [image];
  closeCamera();
  await request("/api/vision", { session_id:sessionId, image }, state.phase === "idle" ? ["Reading your photo"] : ["Looking"]);
}

async function shrink(file) {
  const bitmap = await createImageBitmap(file);
  const canvas = document.createElement("canvas");
  const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
  canvas.width = bitmap.width * scale;
  canvas.height = bitmap.height * scale;
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  bitmap.close();
  return canvas.toDataURL("image/jpeg", 0.85).split(",")[1];
}

async function uploadPhotos(files) {
  if (state.busy || !files.length) return;
  if (!["idle", "done", "stopped", "ended"].includes(state.phase)) return setError("Finish this part first, or tap New task to add photos.");
  try {
    const images = await Promise.all([...files].slice(0, Math.max(1, 6 - state.thumbs.length)).map(shrink));
    state.pending = images;
    await request("/api/photos", { session_id:sessionId, images }, ["Reading your photos", "Finding the parts"], true);
  } catch {
    state.pending = [];
    setError("Those photos couldn't be read. Try again.");
  }
}

async function holdWakeLock() {
  if (wakeLock || !("wakeLock" in navigator)) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLock.addEventListener("release", () => { wakeLock = null; });
  } catch {}
}

function releaseWakeLock() {
  if (wakeLock) { wakeLock.release(); wakeLock = null; }
}

function newTask() {
  closeCamera();
  closeShop();
  stopListening();
  silence();
  state.thumbs = [];
  state.pending = [];
  setHeard("");
  sendRaw("start over");
}

$("start-btn").addEventListener("click", () => {
  unlockAudio();
  $("start").remove();
  speak("What's wrong? Tell me in your own words.");
});
$("stop").addEventListener("click", () => {
  silence();
  stopListening();
  closeCamera();
  closeShop();
  setHeard("Stop");
  sendRaw("stop");
});
$("newTask").addEventListener("click", newTask);
$("talk").addEventListener("click", () => {
  unlockAudio();
  if (!Recognition) return setError("Voice isn't supported in this browser. Please type.");
  if (recognizer) {
    handsFree = false;
    stopListening();
    return setSubtitle("Hands-free paused. Tap to talk again.");
  }
  handsFree = true;
  silence();
  setError("");
  listen();
});
$("camera-btn").addEventListener("click", () => {
  unlockAudio();
  if (camStream) return checkPart();
  openCamera().then(ok => ok && speak("Point the camera at it, then tap again or say: is this it?"));
});
$("photos-btn").addEventListener("click", () => { unlockAudio(); $("photos").click(); });
$("photos").addEventListener("change", async event => {
  await uploadPhotos(event.target.files);
  event.target.value = "";
});
$("keyboard").addEventListener("click", () => {
  const open = $("typed").hidden;
  $("typed").hidden = !open;
  $("keyboard").setAttribute("aria-expanded", open);
  if (open) $("typed-text").focus();
});
$("typed").addEventListener("submit", event => {
  event.preventDefault();
  const text = $("typed-text").value;
  $("typed-text").value = "";
  send(text);
});
document.addEventListener("click", event => {
  if (event.isTrusted && event.target.closest("button") && navigator.vibrate) navigator.vibrate(15);
});
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible" && commandPhase()) holdWakeLock();
});
renderIdle({ say:"", screen:"", photo_count:0, seen_parts:[], product:"" });
updateTalk();
</script>
</body>
</html>
