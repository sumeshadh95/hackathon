<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1020">
<title>Korjaa</title>
<style>
:root {
  --bg:#0b1020; --bg-glow:#13305a; --panel:#141b2e; --panel-2:#1b2440; --line:#26314f;
  --text:#eef2fb; --muted:#93a0bd; --accent:#2ee6a6; --accent-2:#38bdf8; --on-accent:#03140e;
  --amber:#fbbf24; --red:#f43f5e; --shadow:0 10px 30px rgba(0,0,0,.35);
}
@media (prefers-color-scheme: light) {
  :root {
    --bg:#f4f6fb; --bg-glow:#d6e6ff; --panel:#ffffff; --panel-2:#eef2f9; --line:#dde3ef;
    --text:#0f172a; --muted:#5b6782; --accent:#0fb886; --accent-2:#0ea5e9; --on-accent:#ffffff;
    --amber:#b45309; --red:#e11d48; --shadow:0 10px 30px rgba(15,23,42,.08);
  }
}
* { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html { background:var(--bg); }
body {
  margin:0; min-height:100vh; color:var(--text); font:17px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
  background:radial-gradient(900px 500px at 85% -10%, var(--bg-glow), transparent 60%),
             radial-gradient(700px 400px at -10% 10%, color-mix(in srgb, var(--accent) 14%, transparent), transparent 60%), var(--bg);
  background-attachment:fixed;
}
button { font:inherit; color:inherit; border:0; cursor:pointer; }
svg { width:22px; height:22px; fill:none; stroke:currentColor; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }

/* Header */
.top {
  position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:12px 16px; backdrop-filter:blur(14px); background:color-mix(in srgb, var(--bg) 72%, transparent);
  border-bottom:1px solid color-mix(in srgb, var(--line) 60%, transparent);
}
.brand { display:flex; align-items:center; gap:10px; min-width:0; }
.logo {
  flex:none; display:grid; place-items:center; width:38px; height:38px; border-radius:12px; font-weight:800; color:var(--on-accent);
  background:linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow:0 6px 18px color-mix(in srgb, var(--accent) 35%, transparent);
}
h1 { margin:0; font-size:19px; letter-spacing:.2px; }
.status { display:flex; align-items:center; gap:6px; color:var(--muted); font-size:13px; white-space:nowrap; }
.dot { width:8px; height:8px; border-radius:50%; background:var(--muted); transition:background .3s; }
.status[data-kind="listen"] .dot { background:var(--accent); animation:blink 1.2s infinite; }
.status[data-kind="speak"] .dot { background:var(--accent-2); animation:blink .8s infinite; }
.status[data-kind="busy"] .dot { background:var(--amber); animation:blink .6s infinite; }
.status[data-kind="wake"] .dot { background:var(--accent); opacity:.6; }
.status[data-kind="error"] .dot { background:var(--red); }
.top-actions { display:flex; align-items:center; gap:8px; }
.toggle {
  display:flex; align-items:center; gap:8px; height:38px; padding:0 12px 0 8px; border-radius:999px;
  background:var(--panel); border:1px solid var(--line); font-size:13px; font-weight:600; color:var(--muted);
  transition:color .2s, border-color .2s;
}
.switch { position:relative; width:30px; height:18px; border-radius:999px; background:var(--line); transition:background .25s; }
.switch::after {
  content:""; position:absolute; top:2px; left:2px; width:14px; height:14px; border-radius:50%; background:#fff;
  transition:transform .25s cubic-bezier(.4,1.4,.6,1);
}
.toggle[aria-pressed="true"] { color:var(--text); border-color:color-mix(in srgb, var(--accent) 50%, var(--line)); }
.toggle[aria-pressed="true"] .switch { background:var(--accent); }
.toggle[aria-pressed="true"] .switch::after { transform:translateX(12px); }
.stop {
  height:44px; padding:0 18px; border-radius:999px; background:var(--red); color:#fff; font-weight:800; letter-spacing:.6px;
  box-shadow:0 6px 18px color-mix(in srgb, var(--red) 40%, transparent); transition:transform .15s;
}
.stop:active { transform:scale(.94); }

/* Layout */
main { max-width:680px; margin:auto; padding:18px 16px 240px; }
.card {
  background:linear-gradient(180deg, color-mix(in srgb, var(--panel) 92%, transparent), var(--panel));
  border:1px solid var(--line); border-radius:22px; box-shadow:var(--shadow);
}
.hero { position:relative; padding:24px 20px 22px; text-align:center; overflow:hidden; animation:rise .5s ease both; }
.hero.caution { border-color:color-mix(in srgb, var(--amber) 60%, var(--line)); }
.hero.stopped { border-color:color-mix(in srgb, var(--red) 60%, var(--line)); }

/* Voice orb */
.orb { position:relative; width:96px; height:96px; margin:4px auto 18px; --level:0; }
.orb .core {
  position:absolute; inset:14px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff8, transparent 40%), linear-gradient(135deg, var(--accent), var(--accent-2));
  box-shadow:0 0 40px color-mix(in srgb, var(--accent) 45%, transparent);
  transform:scale(calc(1 + var(--level) * .25)); transition:transform .08s linear;
  animation:breathe 4s ease-in-out infinite;
}
.orb .ring { position:absolute; inset:14px; border-radius:50%; border:2px solid var(--accent); opacity:0; }
.orb .bars { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; gap:4px; opacity:0; transition:opacity .3s; }
.orb .bars i { width:5px; height:14px; border-radius:3px; background:var(--on-accent); opacity:.85; }
.orb[data-state="listen"] .ring { animation:ripple 1.8s ease-out infinite; }
.orb[data-state="listen"] .ring:nth-child(3) { animation-delay:.6s; }
.orb[data-state="listen"] .ring:nth-child(4) { animation-delay:1.2s; }
.orb[data-state="speak"] .bars, .orb[data-state="listen"] .bars { opacity:1; }
.orb[data-state="speak"] .bars i { animation:eq .9s ease-in-out infinite; }
.orb[data-state="listen"] .bars i { animation:eq 1.4s ease-in-out infinite; }
.orb .bars i:nth-child(2) { animation-delay:-.2s; } .orb .bars i:nth-child(3) { animation-delay:-.45s; }
.orb .bars i:nth-child(4) { animation-delay:-.1s; } .orb .bars i:nth-child(5) { animation-delay:-.35s; }
.orb[data-state="busy"] .core { animation:spin-hue 1.4s linear infinite; }
.orb[data-state="busy"]::after {
  content:""; position:absolute; inset:4px; border-radius:50%; border:3px solid transparent;
  border-top-color:var(--accent); border-right-color:var(--accent-2); animation:spin .9s linear infinite;
}
.orb[data-state="wake"] .core { animation:breathe 2.4s ease-in-out infinite; }
.hero.caution .orb .core { background:linear-gradient(135deg, var(--amber), #fb923c); box-shadow:0 0 40px color-mix(in srgb, var(--amber) 45%, transparent); }
.hero.stopped .orb .core { background:linear-gradient(135deg, var(--red), #fb7185); box-shadow:0 0 40px color-mix(in srgb, var(--red) 45%, transparent); }

.counter { color:var(--muted); font-size:13px; font-weight:700; letter-spacing:.8px; text-transform:uppercase; min-height:20px; }
.progress { height:6px; margin:10px auto 0; max-width:280px; border-radius:999px; background:var(--panel-2); overflow:hidden; display:none; }
.progress.on { display:block; }
#bar { height:100%; width:0; border-radius:inherit; background:linear-gradient(90deg, var(--accent), var(--accent-2)); transition:width .5s cubic-bezier(.4,0,.2,1); }
.screen { margin:16px 0 8px; font-size:clamp(22px, 5.4vw, 28px); font-weight:750; line-height:1.3; text-wrap:balance; }
.screen.amber { color:var(--amber); }
.screen.thinking { background:linear-gradient(90deg, var(--muted) 20%, var(--text) 50%, var(--muted) 80%); background-size:200% 100%;
  -webkit-background-clip:text; background-clip:text; color:transparent; animation:shimmer 1.6s linear infinite; }
.fade { animation:fade-up .45s ease both; }
#detail { color:var(--muted); font-size:16px; }
#detail:empty, #uses:empty, #photoStatus:empty, #items:empty, #sources:empty, #actions:empty { display:none; }
.chips { display:flex; flex-wrap:wrap; justify-content:center; gap:6px; margin-top:14px; }
.chip { padding:5px 12px; border-radius:999px; font-size:14px; font-weight:600; color:var(--accent);
  background:color-mix(in srgb, var(--accent) 12%, transparent); border:1px solid color-mix(in srgb, var(--accent) 30%, transparent); }
.primary {
  margin-top:18px; width:100%; min-height:58px; border-radius:16px; font-size:18px; font-weight:800; color:var(--on-accent);
  background:linear-gradient(135deg, var(--accent), var(--accent-2)); box-shadow:0 10px 26px color-mix(in srgb, var(--accent) 35%, transparent);
  transition:transform .15s, filter .2s;
}
.primary:hover { filter:brightness(1.06); } .primary:active { transform:scale(.98); }

/* Contextual actions */
.actions { display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
.actions button {
  flex:1 1 calc(25% - 10px); min-width:120px; min-height:54px; padding:0 14px; border-radius:16px; font-weight:700;
  display:flex; align-items:center; justify-content:center; gap:8px;
  background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow);
  animation:pop .35s cubic-bezier(.3,1.4,.6,1) both; transition:transform .15s, border-color .2s, background .2s;
}
.actions button:nth-child(2) { animation-delay:.04s; } .actions button:nth-child(3) { animation-delay:.08s; }
.actions button:nth-child(4) { animation-delay:.12s; } .actions button:nth-child(5) { animation-delay:.16s; }
.actions button:hover { border-color:color-mix(in srgb, var(--accent) 50%, var(--line)); }
.actions button:active { transform:scale(.96); }
.actions button.main { color:var(--on-accent); border-color:transparent; background:linear-gradient(135deg, var(--accent), var(--accent-2)); }
.actions button.warn { color:#1a1200; border-color:transparent; background:var(--amber); }
.actions svg { width:18px; height:18px; }

#photoStatus { margin-top:14px; color:var(--muted); font-size:14px; text-align:center; }
#items { display:grid; gap:10px; margin-top:16px; }
.item { padding:14px 16px; font-weight:600; animation:rise .4s ease both; }
.links { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
a { color:var(--accent); text-decoration:none; }
.links a, #sources a {
  display:inline-flex; align-items:center; gap:6px; padding:6px 12px; border-radius:999px; font-size:14px; font-weight:600;
  background:var(--panel-2); border:1px solid var(--line); transition:border-color .2s;
}
.links a:hover, #sources a:hover { border-color:var(--accent); }
#sources { display:flex; flex-direction:column; align-items:flex-start; gap:8px; margin-top:16px; }
#sources a { max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--muted); }
footer { margin-top:24px; color:var(--muted); font-size:13px; text-align:center; opacity:.8; }

/* Composer */
.dock { position:fixed; left:0; right:0; bottom:0; z-index:30; padding:10px 12px calc(12px + env(safe-area-inset-bottom));
  background:linear-gradient(0deg, var(--bg) 88%, transparent); }
.composer {
  position:relative; max-width:680px; margin:auto; display:flex; align-items:center; gap:6px; padding:6px;
  border-radius:999px; background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow);
  transition:border-color .2s, box-shadow .2s;
}
.composer:focus-within { border-color:color-mix(in srgb, var(--accent) 55%, var(--line)); box-shadow:var(--shadow), 0 0 0 4px color-mix(in srgb, var(--accent) 14%, transparent); }
.composer input { flex:1; min-width:0; height:44px; padding:0 6px; border:0; outline:0; background:transparent; color:var(--text); font-size:16px; }
.composer input::placeholder { color:var(--muted); }
.icon {
  position:relative; flex:none; display:grid; place-items:center; width:44px; height:44px; border-radius:50%;
  background:var(--panel-2); color:var(--text); transition:transform .2s, background .2s, color .2s, opacity .2s;
}
.icon:active { transform:scale(.9); }
#plus svg { transition:transform .3s cubic-bezier(.3,1.4,.6,1); }
#plus[aria-expanded="true"] { background:var(--text); color:var(--bg); }
#plus[aria-expanded="true"] svg { transform:rotate(135deg); }
.send { color:var(--on-accent); background:linear-gradient(135deg, var(--accent), var(--accent-2)); }
.send:disabled { opacity:.35; cursor:default; transform:none; }

.mic .ring { position:absolute; inset:0; border-radius:50%; border:2px solid var(--accent); opacity:0; pointer-events:none; }
.mic[data-state="listen"] { color:var(--on-accent); background:var(--accent); box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 50%, transparent); animation:mic-glow 1.4s ease-out infinite; }
.mic[data-state="listen"] .ring { animation:ripple-sm 1.6s ease-out infinite; }
.mic[data-state="listen"] .ring + .ring { animation-delay:.8s; }
.mic[data-state="wake"] { color:var(--accent); background:color-mix(in srgb, var(--accent) 14%, var(--panel-2)); }
.mic[data-state="wake"]::after { content:""; position:absolute; top:6px; right:6px; width:7px; height:7px; border-radius:50%; background:var(--accent); animation:blink 1.6s infinite; }

.wave { display:none; align-items:center; gap:3px; height:44px; padding:0 6px; flex:1; }
.wave i { flex:1; max-width:4px; height:30%; border-radius:2px; background:var(--accent); animation:eq 1s ease-in-out infinite; }
.composer.listening input { display:none; }
.composer.listening .wave { display:flex; }
.wave span { margin-left:8px; color:var(--muted); font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; flex:1 1 auto; max-width:60%; }

.menu {
  position:absolute; left:6px; bottom:calc(100% + 10px); display:grid; gap:4px; min-width:210px; padding:6px;
  border-radius:18px; background:var(--panel); border:1px solid var(--line); box-shadow:var(--shadow);
  transform-origin:bottom left; animation:menu-in .22s cubic-bezier(.3,1.3,.6,1) both;
}
.menu[hidden] { display:none; }
.menu button { display:flex; align-items:center; gap:12px; padding:12px 14px; border-radius:12px; background:transparent; text-align:left; font-weight:600; }
.menu button:hover { background:var(--panel-2); }
.menu .ico { display:grid; place-items:center; width:34px; height:34px; border-radius:10px; color:var(--on-accent); background:linear-gradient(135deg, var(--accent), var(--accent-2)); }
.menu .ico svg { width:18px; height:18px; }

/* Camera overlay */
.camera { position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:16px; background:rgba(3,6,15,.82); backdrop-filter:blur(6px); animation:fade-in .2s ease both; }
.camera[hidden] { display:none; }
.viewfinder { position:relative; width:min(560px, 100%); border-radius:22px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,.6); border:2px solid var(--accent); }
.viewfinder video { display:block; width:100%; }
.countdown { position:absolute; inset:0; display:grid; place-items:center; font-size:96px; font-weight:800; color:#fff; text-shadow:0 4px 30px rgba(0,0,0,.6); }
.countdown.tick { animation:tick 1s ease both; }

.toast { position:fixed; left:50%; bottom:96px; z-index:40; transform:translateX(-50%); padding:10px 16px; border-radius:999px;
  background:var(--text); color:var(--bg); font-size:14px; font-weight:600; box-shadow:var(--shadow); animation:toast 2.6s ease both; pointer-events:none; }

.actions button.wide { flex-basis:100%; }
.actions button.suggest { flex:1 1 calc(50% - 10px); min-height:46px; font-size:15px; font-weight:600; color:var(--muted); }
.actions button.suggest:hover { color:var(--text); }

/* Live camera call */
.call { position:fixed; inset:0; z-index:60; background:#000; color:#fff; animation:fade-in .25s ease both; overflow:hidden; }
.call[hidden] { display:none; }
.call video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
.call-shade { position:absolute; inset:0; pointer-events:none;
  background:linear-gradient(180deg, rgba(0,0,0,.55), transparent 22%, transparent 55%, rgba(0,0,0,.75)); }
.call-top { position:absolute; top:0; left:0; right:0; display:flex; align-items:center; gap:8px; padding:calc(14px + env(safe-area-inset-top)) 16px 14px; }
.live-pill { flex:none; display:inline-flex; align-items:center; gap:6px; padding:6px 10px; border-radius:999px;
  background:rgba(244,63,94,.92); font-size:12px; font-weight:800; letter-spacing:1px; }
.live-pill i { width:7px; height:7px; border-radius:50%; background:#fff; animation:blink 1s infinite; }
.call-tag { flex:1; min-width:0; padding:6px 12px; border-radius:999px; background:rgba(15,23,42,.55); backdrop-filter:blur(10px);
  font-size:14px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; transition:background .3s; }
.call-tag.found { background:color-mix(in srgb, var(--accent) 35%, rgba(15,23,42,.6)); }
.call-stop { flex:none; height:34px; padding:0 14px; border-radius:999px; background:var(--red); color:#fff; font-weight:800; letter-spacing:.5px; }
.reticle { position:absolute; left:10%; right:10%; top:20%; bottom:36%; pointer-events:none; }
.reticle i { position:absolute; width:34px; height:34px; border:3px solid rgba(255,255,255,.85); transition:border-color .3s; }
.reticle i:nth-child(1) { top:0; left:0; border-right:0; border-bottom:0; border-radius:14px 0 0 0; }
.reticle i:nth-child(2) { top:0; right:0; border-left:0; border-bottom:0; border-radius:0 14px 0 0; }
.reticle i:nth-child(3) { bottom:0; left:0; border-right:0; border-top:0; border-radius:0 0 0 14px; }
.reticle i:nth-child(4) { bottom:0; right:0; border-left:0; border-top:0; border-radius:0 0 14px 0; }
.reticle b { position:absolute; left:4%; right:4%; top:0; height:3px; border-radius:3px; opacity:0;
  background:linear-gradient(90deg, transparent, var(--accent), transparent); box-shadow:0 0 18px var(--accent); }
.call.scanning .reticle i { border-color:var(--accent); }
.call.scanning .reticle b { animation:sweep 1.4s ease-in-out infinite; }
.call-bottom { position:absolute; left:0; right:0; bottom:0; display:grid; justify-items:center; gap:12px;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom)); }
.caption { width:100%; max-width:620px; padding:14px 18px; border-radius:20px; text-align:center;
  background:rgba(11,16,32,.72); backdrop-filter:blur(14px); border:1px solid rgba(255,255,255,.12);
  font-size:clamp(17px, 4.6vw, 21px); font-weight:650; line-height:1.4; }
.caption small { display:block; margin-top:6px; color:#cbd5e1; font-size:14px; font-weight:500; }
.caption small:empty { display:none; }
.guide-btn { padding:10px 18px; border-radius:999px; font-weight:700; color:var(--on-accent);
  background:linear-gradient(135deg, var(--accent), var(--accent-2)); animation:pop .35s cubic-bezier(.3,1.4,.6,1) both; }
.guide-btn[hidden] { display:none; }
.call-bar { display:flex; align-items:center; gap:14px; }
.call-btn { position:relative; display:grid; place-items:center; width:54px; height:54px; border-radius:50%;
  background:rgba(255,255,255,.18); color:#fff; backdrop-filter:blur(10px); transition:transform .15s, background .2s, color .2s; }
.call-btn:active { transform:scale(.9); }
.call-btn[aria-pressed="false"] { background:rgba(255,255,255,.92); color:#0f172a; }
.call-btn[aria-pressed="false"]::after { content:""; position:absolute; width:28px; height:2.5px; border-radius:2px; background:currentColor; transform:rotate(-45deg); }
.call-btn.listening { box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 60%, transparent); animation:mic-glow 1.4s ease-out infinite; background:var(--accent); color:var(--on-accent); }
.call-btn.big { width:70px; height:70px; color:var(--on-accent); background:linear-gradient(135deg, var(--accent), var(--accent-2)); }
.call-btn.big svg { width:30px; height:30px; }
.call-btn.end { background:var(--red); }

/* Merged features */
.call-thumb { position:absolute; top:calc(68px + env(safe-area-inset-top)); right:14px; z-index:2; width:92px; height:92px; border:2px solid var(--accent); border-radius:16px; object-fit:cover; box-shadow:0 10px 26px rgba(0,0,0,.5); animation:pop .25s ease both; }
.call-thumb[hidden] { display:none; }
.call-card { width:100%; max-width:620px; max-height:62vh; display:flex; flex-direction:column; gap:10px; padding:14px 16px 16px; overflow-y:auto; border-radius:24px; background:rgba(11,16,32,.9); border:1px solid rgba(255,255,255,.14); backdrop-filter:blur(16px); box-shadow:0 -14px 40px rgba(0,0,0,.45); animation:sheet-up .32s cubic-bezier(.2,.8,.2,1) both; }
.call-card[hidden] { display:none; }
.card-grab { width:40px; height:4px; margin:0 auto 2px; border-radius:2px; background:rgba(255,255,255,.3); }
.card-head { display:flex; align-items:center; justify-content:space-between; gap:10px; }
.card-head h2 { margin:0; font-size:19px; }
.card-head span { flex:none; color:#cbd5e1; font-size:14px; font-weight:700; }
.card-steps { display:grid; gap:6px; margin:0; padding:0; list-style:none; }
.card-steps li { display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border-radius:14px; color:#cbd5e1; font-size:16px; line-height:1.35; transition:background .2s, color .2s; }
.card-steps li b { flex:none; display:grid; place-items:center; width:24px; height:24px; border-radius:50%; background:rgba(255,255,255,.14); font-size:13px; }
.card-steps li.done { opacity:.55; text-decoration:line-through; }
.card-steps li.now { background:color-mix(in srgb, var(--accent) 22%, transparent); color:#fff; font-size:18px; font-weight:700; }
.card-steps li.now b { background:var(--accent); color:var(--on-accent); }
.card-note { min-height:20px; color:#cbd5e1; font-size:14px; }

<script>
const $ = id => document.getElementById(id);
const sessionId = crypto.randomUUID();
const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
const WAKE = /\b(?:(?:hey|hi|hay|a|ok|okay)[\s,]+(?:buddy|buddie|bodie|body|birdie)|(?:(?:hey|ok|okay|hi)\s+)?(?:korjaa|korja|koria|correa|kordia))\b[\s,.!?]*/i;
const VOICE_QUESTION = /^(what|what's|how|why|where|when|which|who|can|could|should|is|are|do|does|did|will|would|am)\b/i;
const SHORT_COMMAND = /\b(next|previous|back|repeat|again|stuck|help|continue|ready|wait|hold on|pause|resume|quiet|yes|no|done|finished|fixed|check this|camera|take a look|timer|understand)\b/i;
const BUYING = /\b(?:(?:don't|do not) have |(?:i'm|i am) missing |need to (?:buy|order) |where (?:can|could|do|should) i (?:buy|order)\b|\bbuy\b)/i;
// Phones share the mic and speaker badly, so talking over Korjaa is desktop only.
const BARGE_IN = !/Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
const EMERGENCY = /\b(stop|smoke|smoking|fire|burning|sparks?|sparking|shock|shocked|gas)\b/i;
const FOLLOW_UP_MS = 8000;
const ICONS = {
  next:'<svg viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  back:'<svg viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>',
  repeat:'<svg viewBox="0 0 24 24"><path d="M4 12a8 8 0 0 1 14-5.3L20 9M20 4v5h-5M20 12a8 8 0 0 1-14 5.3L4 15M4 20v-5h5"/></svg>',
  stuck:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01"/></svg>',
  camera:'<svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13.5" r="3.5"/></svg>',
  check:'<svg viewBox="0 0 24 24"><path d="m5 12 5 5L20 7"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  video:'<svg viewBox="0 0 24 24"><rect x="2" y="6" width="14" height="12" rx="2"/><path d="m16 10 6-3v10l-6-3z"/></svg>',
};
const LIVE_ASK = /\b(what|how|why|where|when|which|should|can|could|do i|does|is it|are there|next|now|help|stains?|still|done|finished|already)\b/i;
const LIVE_GAP_MS = 1800;
const LIVE_SIZE = 1280, LIVE_SHOTS = 4, LIVE_SHOT_GAP_MS = 110, LIVE_REPEAT_MS = 12000, LIVE_CHANGE = 7;
const COMMAND = /^(next|back|repeat|stuck|ready|continue|start over|new task|i understand the risk)\b/i;
const PHASE_ACTIONS = {
  idle: [["Live camera help", "live", "main wide", "video"],
         ["Kitchen sink is clogged", "My kitchen sink is clogged", "suggest"],
         ["Washing machine won't drain", "My washing machine won't drain", "suggest"],
         ["Assemble a flat-pack shelf", "Assemble a flat-pack shelf", "suggest"],
         ["Make a sandwich", "Make a sandwich with bread, cheese and tomato", "suggest"]],
  caution: [["I understand the risk", "I understand the risk", "warn", "check"], ["No thanks", "no", "nav", "back"]],
  items: [["Continue", "continue", "main", "next"]],
  gate: [["I'm ready", "ready", "main", "check"]],
  paused: [["New task", "start over", "nav", "plus"], ["Resume", "resume", "main", "next"]],
  done: [["New task", "start over", "main", "plus"], ["Live camera help", "live", "", "video"]],
  ended: [["New task", "start over", "main", "plus"], ["Live camera help", "live", "", "video"]],
  stopped: [["New task", "start over", "main", "plus"]],
};

let audioCtx, analyser, recognition, source, wakeLock = null, phase = "idle", busy = false, speaking = false, started = false;
let handsFree = false, manual = false, voiceTurn = false, awakeUntil = 0, recActive = false;
let callAsking = false, liveAbort = null, interimTimer = null, interimText = "", cardSteps = [], cardIndex = 0, liveSignature = null, liveLastSent = 0, spokenText = "", timerEnd = 0, timerTick = null, micPaused = false, requestId = 0, speechId = 0, last = null, lastCommand = "", staged = [], ticked = new Set(), planKey = "", shopLoading = false;
let callOn = false, callStream = null, callFacing = "environment", callMic = true, callVoice = true, callQuestion = "", callWake = null, callFound = "";
try { handsFree = localStorage.getItem("korjaa-handsfree") === "1"; } catch {}
try { callVoice = localStorage.getItem("korjaa-call-voice") !== "0"; } catch {}

function setStatus(text, kind = "") {
  $("statusText").textContent = text;
  $("status").dataset.kind = kind;
}

function toast(text) {
  const el = document.createElement("div");
  el.className = "toast";
  el.textContent = text;
  document.body.append(el);
  setTimeout(() => el.remove(), 2700);
}

function setScreen(text, thinking = false) {
  const el = $("screen");
  el.textContent = text;
  el.classList.toggle("thinking", thinking);
  el.classList.remove("fade");
  void el.offsetWidth;
  el.classList.add("fade");
}

function setOrb(state) { $("orb").dataset.state = state; }

async function post(url, body) {
  const response = await fetch(url, { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify(body) });
  if (!response.ok) throw new Error(url);
  return response;
}

async function ensureAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioCtx.createAnalyser();
    analyser.fftSize = 256;
    analyser.connect(audioCtx.destination);
  }
  if (audioCtx.state !== "running") await audioCtx.resume();
}

async function begin() {
  if (started) return;
  started = true;
  $("start").remove();
  await ensureAudio();
  setupVoice();
  renderActions();
}

async function send(text) {
  const urgent = ["stop", "start over"].includes(text);
  if (busy && !urgent) return toast("One moment, I'm still working on that.");
  await begin();
  closeMenu();
  if (!urgent && staged.length && phase === "idle") return submitPhotos(text);
  const id = ++requestId;
  busy = true;
  lastCommand = text.toLowerCase();
  interruptSpeech();
  if (["idle","ended","done","stopped"].includes(phase) && !urgent) {
    setStatus("Searching online", "busy");
    setOrb("busy");
    setScreen("Looking that up…", true);
  } else {
    setStatus("Thinking", "busy");
  }
  try {
    const result = await (await post("/api/turn", { session_id:sessionId, text })).json();
    if (id !== requestId) return;
    busy = false;
    await render(result);
  } catch {
    if (id !== requestId) return;
    busy = false;
    closeShop();
    setOrb("idle");
    if (last) paint(last); else setScreen("Something went wrong. Try again.");
    setStatus("Connection problem. Try again.", "error");
    toast("Connection problem. Try again.");
  }
  updateVoiceUI();
}

function setTimer(seconds) {
  clearInterval(timerTick);
  timerEnd = seconds > 0 ? Date.now() + seconds * 1000 : 0;
  $("timer").hidden = !timerEnd;
  if (!timerEnd) return;
  const total = seconds;
  const paintTimer = () => {
    const left = Math.max(0, Math.ceil((timerEnd - Date.now()) / 1000));
    $("timerText").textContent = `${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
    if (left > 0) return;
    setTimer(0);
    chime();
    speak(`Your ${total >= 60 ? `${Math.round(total / 60)} minute` : `${total} second`} timer is done.`);
  };
  paintTimer();
  timerTick = setInterval(paintTimer, 500);
}

async function render(result) {
  // Voice comes first: a drawing problem must never silence the spoken step.
  try { paint(result); } catch (error) { console.error(error); }
  if (result.action === "timer") setTimer(result.timer);
  if (["stopped", "ended"].includes(result.phase)) setTimer(0);
  await speak(result.say);
  if (result.action === "camera") await capture();
}

function screenText(r) {
  if (r.check) return r.check;
  if (r.phase === "items") return "What you'll need";
  if (r.phase === "gate") return "Safety first";
  if (r.phase === "done") return "All done";
  if (r.phase === "paused") return "Paused";
  return r.screen;
}

function paint(view) {
  // Missing lists must never leave the screen half drawn.
  const result = { say:"", screen:"", detail:"", check:"", title:"", uses:[], how:[], items:[], safety:[], seen_parts:[], sources:[], ...view };
  phase = result.phase;
  last = result;
  const text = screenText(result);
  if (text) setScreen(text);
  else if (phase === "idle" && !callOn) setScreen("What do you need help with?");
  const refused = phase === "ended" && !/^(Okay, I'll stop|I couldn't build)/.test(result.say);
  $("screen").classList.toggle("amber", phase === "caution");
  $("hero").classList.toggle("caution", phase === "caution" || phase === "gate");
  $("hero").classList.toggle("stopped", phase === "stopped" || refused);
  $("counter").textContent = result.step ? `Step ${result.step} of ${result.total}` : result.title;
  $("progress").classList.toggle("on", !!result.step);
  $("bar").style.width = result.step ? `${(result.step / result.total) * 100}%` : "0";
  const asideNote = (phase === "paused") || (phase === "steps" && !result.check && !result.shopping && result.say && result.say !== result.screen);
  $("detail").textContent = asideNote ? result.say : "";
  $("uses").replaceChildren(...(result.check ? [] : result.uses.filter(use => !/^(none|n\/a)$/i.test(use))).map(use => Object.assign(document.createElement("span"), { className:"chip", textContent:use })));
  $("photoStatus").textContent = phase === "idle" && result.photo_count ? `${result.photo_count} of 6 photos added` : "";
  renderExtra(result);
  renderItems(result);
  renderSources(phase === "steps" ? result.sources : []);
  if (result.shopping) renderShop(result.shopping, result.say);
  else if (shopLoading) closeShop();
  renderActions();
  updateWakeLock();
  refreshVoice();
  if (callOn && result.say) setCaption(result.say);
}

function el(tag, className, text, ...children) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  if (text !== undefined && text !== null) node.textContent = text;
  node.append(...children);
  return node;
}

function renderExtra(r) {
  const nodes = [];
  if (r.phase === "gate") {
    if (r.saved) nodes.push(el("p", "note", "Saved guide"));
    nodes.push(el("div", "list-card", null, el("strong", "", "Check each one, then tell me you're ready"), el("ol", "", null, ...r.safety.map(text => el("li", "", text)))));
  }
  if (r.phase === "done") {
    const skipped = r.skipped === 1 ? "1 step" : `${r.skipped} steps`;
    nodes.push(el("p", "note", r.skipped ? `${r.title}. Fixed early, so you skipped ${skipped}.` : `${r.title}. Nicely finished.`));
  }
  if (r.phase === "steps" && !r.check) {
    if (r.how.length) nodes.push(el("div", "list-card", null, el("strong", "", "How to do it"), el("ol", "", null, ...r.how.map(text => el("li", "", text)))));
    if (r.image) {
      const image = Object.assign(new Image(), { src:r.image.url, alt:r.image.caption, referrerPolicy:"no-referrer", loading:"lazy" });
      const link = makeLink("", r.image.url);
      link.append(image);
      const figure = el("figure", "step-image", null, link, el("figcaption", "", `${r.image.caption} Example image from ${r.image.source}. Compare it with your own item.`));
      image.onerror = () => figure.remove();
      nodes.push(figure);
    }
    if (r.detail) {
      const details = el("details", "", null, el("summary", "", "More detail"), el("p", "", r.detail));
      details.open = !r.image;
      nodes.push(details);
    }
  }
  $("extra").replaceChildren(...nodes);
}

function actionsFor(r) {
  if (r?.phase === "steps" && r.check) {
    return [["No, keep going", "no", "nav", "next"], ["Yes, it's fixed", "yes", "main", "check"], ["Back to this step", "back", "", "back"]];
  }
  if (r?.phase === "steps") {
    const list = [["Previous", "back", "nav", "back"], [r.step === r.total ? "Finish" : "Next", "next", "main", r.step === r.total ? "check" : "next"],
      ["Repeat", "repeat", "", "repeat"], ["Stuck", "stuck", "", "stuck"],
      ["Check this", "camera", "", "camera"], ["Live camera", "live", "", "video"]];
    if (r.can_finish) list.push(["It's fixed", "it's fixed", "wide", "check"]);
    return list;
  }
  return PHASE_ACTIONS[phase] || [];
}

function renderActions() {
  const box = $("actions"), nav = $("nav");
  box.replaceChildren();
  nav.replaceChildren();
  for (const [label, cmd, kind, icon] of actionsFor(last)) {
    const button = document.createElement("button");
    button.type = "button";
    button.className = kind;
    button.innerHTML = ICONS[icon] || "";
    button.append(label);
    button.disabled = cmd === "back" && last?.step === 1 && !last?.check;
    button.onclick = () => cmd === "live" ? startCall() : send(cmd);
    (/main|warn|nav/.test(kind) && phase !== "idle" ? nav : box).append(button);
  }
  nav.hidden = !nav.children.length;
}

function makeLink(label, url, className = "") {
  const a = document.createElement("a");
  a.textContent = label;
  a.className = className;
  if (/^https?:\/\//i.test(url)) a.href = url;
  a.target = "_blank";
  a.rel = "noopener noreferrer";
  return a;
}

function renderItems(r) {
  if (r.phase === "idle") {
    return $("items").replaceChildren(...r.seen_parts.map((part, i) => {
      const card = el("div", "card item part", null, el("b", "", part.count === "unknown" ? "?" : `×${part.count}`), el("div", "", part.name, el("small", "", part.looks_like)));
      card.style.animationDelay = `${i * 40}ms`;
      return card;
    }));
  }
  if (r.phase !== "items") return $("items").replaceChildren();
  const key = `${r.title}|${r.items.map(item => item.name).join("|")}`;
  if (key !== planKey) { planKey = key; ticked = new Set(); }
  $("items").replaceChildren(...r.items.map((item, i) => {
    const tick = el("button", "tick", null, el("span", "box"), el("span", "name", item.name));
    tick.type = "button";
    tick.setAttribute("aria-pressed", ticked.has(item.name));
    tick.onclick = () => {
      const on = !ticked.has(item.name);
      on ? ticked.add(item.name) : ticked.delete(item.name);
      tick.setAttribute("aria-pressed", on);
    };
    const need = el("button", "need", "Need this?");
    need.type = "button";
    need.setAttribute("aria-label", `Find where to buy ${item.name}`);
    need.onclick = () => openShop(item);
    const card = el("div", "card item", null, el("div", "tick-row", null, tick, need));
    card.style.animationDelay = `${i * 40}ms`;
    return card;
  }));
}

function shopHead(title) {
  const close = el("button", "", "\u00d7");
  close.type = "button";
  close.setAttribute("aria-label", "Close");
  close.onclick = closeShop;
  return el("div", "sheet-head", null, el("h2", "", title), close);
}

function quickLinks(links) {
  return el("div", "links", null, ...links.map(link => makeLink(link.shop, link.url)));
}

function openShop(item) {
  if (busy) return toast("One moment, I'm still working on that.");
  shopLoading = true;
  const compare = el("p", "note", "Comparing shops near you…");
  $("sheet").replaceChildren(shopHead(item.name), quickLinks(item.links), compare, el("div", "sk"), el("div", "sk"), el("div", "sk short"));
  $("sheet").hidden = $("scrim").hidden = false;
  send(`I need to buy ${item.name}`);
}

function closeShop() {
  shopLoading = false;
  $("sheet").hidden = $("scrim").hidden = true;
  $("sheet").replaceChildren();
}

function renderShop(shopping, say) {
  shopLoading = false;
  const options = shopping.options.map(option => {
    const box = el("div", "option", null, el("small", "", option.shop), el("strong", "", option.title));
    if (option.price) box.append(el("div", "price", `${option.price} (price shown on the page)`));
    if (option.why) box.append(el("small", "", option.why));
    box.append(makeLink("Open", option.url, "open"));
    return box;
  });
  const steps = el("details", "", null, el("summary", "", "How to buy it"), el("ol", "", null, ...shopping.buying_steps.map(text => el("li", "", text))));
  const checks = el("details", "", null, el("summary", "", "Check before you order"), el("ol", "", null, ...shopping.checks.map(text => el("li", "", text))));
  $("sheet").replaceChildren(shopHead(shopping.item), el("p", "note", say), ...options, steps, checks, el("p", "note", "Korjaa never places an order. You decide and buy on the shop's own page."));
  $("sheet").hidden = $("scrim").hidden = false;
  $("sheet").scrollTop = 0;
}

function renderSources(sources) {
  $("sources").replaceChildren();
  for (const item of sources) $("sources").append(makeLink(`↗ ${item.title}`, item.url));
}

function animateLevel() {
  if (!speaking || !analyser) { $("orb").style.setProperty("--level", 0); return; }
  const data = new Uint8Array(analyser.frequencyBinCount);
  analyser.getByteFrequencyData(data);
  const level = data.reduce((a, b) => a + b, 0) / data.length / 140;
  $("orb").style.setProperty("--level", Math.min(1, level).toFixed(3));
  requestAnimationFrame(animateLevel);
}

async function speak(text) {
  if (!text || (callOn && !callVoice)) return refreshVoice();
  interruptSpeech();
  const id = speechId;
  speaking = true;
  spokenText = text.toLowerCase();
  if (callOn || !(BARGE_IN && taskListening())) stopRecognition();
  setStatus("Speaking", "speak");
  setOrb("speak");
  try {
    await ensureAudio();
    const response = await post("/api/tts", { text });
    const audio = await audioCtx.decodeAudioData(await response.arrayBuffer());
    if (id !== speechId) return;
    await new Promise(resolve => {
      source = audioCtx.createBufferSource();
      source.buffer = audio;
      source.connect(analyser);
      source.onended = resolve;
      source.start();
      requestAnimationFrame(animateLevel);
    });
  } catch {
    if (id !== speechId) return;
    await new Promise(resolve => {
      const line = new SpeechSynthesisUtterance(text);
      line.onend = line.onerror = resolve;
      speechSynthesis.speak(line);
    });
  }
  if (id !== speechId) return;
  speaking = false;
  if (handsFree) awakeUntil = Date.now() + FOLLOW_UP_MS;
  else if (voiceTurn && !callOn && !taskListening()) manual = true;
  voiceTurn = false;
  refreshVoice();
}

function interruptSpeech() {
  speechId++;
  try { source?.stop(); } catch {}
  speechSynthesis.cancel();
  speaking = false;
}

/* Voice: manual push-to-talk with the mic button, or hands-free with the "hey buddy" wake phrase */
function taskListening() { return ["caution", "items", "gate", "steps", "paused"].includes(phase) && !micPaused; }
function wantRecognition() { return !!recognition && !callAsking && (!speaking || (BARGE_IN && taskListening() && !callOn)) && (manual || handsFree || taskListening() || (callOn && callMic)); }
function isAwake() { return manual || taskListening() || (callOn && callMic) || Date.now() < awakeUntil; }

function stopRecognition() {
  if (recognition && recActive) try { recognition.abort(); } catch {}
}

function refreshVoice() {
  if (wantRecognition() && !recActive) try { recognition.start(); recActive = true; } catch {}
  if (!wantRecognition()) stopRecognition();
  updateVoiceUI();
}

function updateVoiceUI() {
  const listening = !speaking && recActive && isAwake();
  const standby = !speaking && recActive && handsFree && !isAwake();
  $("mic").dataset.state = listening ? "listen" : standby ? "wake" : "off";
  $("callMic").classList.toggle("listening", callOn && listening);
  $("typed").classList.toggle("listening", listening);
  $("handsfree").setAttribute("aria-pressed", handsFree);
  if (speaking || busy) return;
  if (listening) { setStatus("Listening", "listen"); setOrb("listen"); }
  else if (standby) { setStatus("Say “hey buddy”", "wake"); setOrb("wake"); }
  else if (started) { setStatus(recognition ? "Tap the mic or type" : "Type your request", ""); setOrb("idle"); }
}

function setupVoice() {
  if (!Recognition || recognition) return;
  recognition = new Recognition();
  recognition.lang = "en-US";
  recognition.continuous = true;
  recognition.interimResults = true;
  recognition.onresult = event => {
    const result = event.results[event.results.length - 1];
    const heard = result[0].transcript.trim();
    if (!heard) return;
    if (speaking && !(result.isFinal && !isEcho(heard) && heard.split(/\s+/).length <= 6 && (SHORT_COMMAND.test(heard) || EMERGENCY.test(heard)))) return;
    const awake = isAwake();
    if (awake) { $("live").textContent = heard; $("heard").textContent = `You said: ${heard}`; }
    if (awake && callOn) $("callHeard").textContent = `You: ${heard}`;
    if (!result.isFinal) {
      if (!awake && WAKE.test(heard)) wake();
      // A noisy room can delay the final result, so a pause in a spoken question counts as the end of it.
      if (awake && callOn && heard.split(/\s+/).length >= 4) {
        clearTimeout(interimTimer);
        interimText = heard;
        interimTimer = setTimeout(() => { if (callOn && interimText) handle(interimText.replace(WAKE, "").trim()); }, 1700);
      }
      return;
    }
    clearTimeout(interimTimer);
    interimText = "";
    if (callAsking) return;
    $("live").textContent = "Listening…";
    if (EMERGENCY.test(heard) && !awake) return handle(heard);
    if (awake) return handle(heard.replace(WAKE, "").trim());
    if (WAKE.test(heard)) {
      wake();
      const rest = heard.split(WAKE).pop().trim();
      if (rest) handle(rest);
    }
  };
  recognition.onerror = event => {
    if (event.error === "not-allowed" || event.error === "service-not-allowed") {
      handsFree = manual = false;
      micPaused = true;
      toast("Microphone permission was blocked. You can still use the buttons or type.");
    }
  };
  recognition.onend = () => {
    recActive = false;
    if (manual && !handsFree) manual = false;
    if (wantRecognition()) setTimeout(refreshVoice, 250);
    else updateVoiceUI();
  };
  setInterval(() => { if (handsFree && recActive) updateVoiceUI(); }, 1000);
  refreshVoice();
}

function wake() {
  awakeUntil = Date.now() + FOLLOW_UP_MS;
  chime();
  updateVoiceUI();
}

function isEcho(text) {
  const words = text.toLowerCase().replace(/[^a-z0-9' ]/g, "").split(/\s+/).filter(Boolean);
  const hits = words.filter(word => spokenText.includes(word)).length;
  return words.length > 0 && hits / words.length >= 0.6;
}

// Room chatter must not move the step or set Korjaa talking. Hazard words always get through.
function meantForKorjaa(text) {
  if (!["caution", "items", "gate", "steps", "paused"].includes(phase) || EMERGENCY.test(text) || BUYING.test(text)) return true;
  const words = text.split(/\s+/).length;
  return (words <= 6 && SHORT_COMMAND.test(text)) || (words <= 16 && VOICE_QUESTION.test(text));
}

function normalizeCommand(text) {
  const clean = text.toLowerCase().replace(/[.,!?]/g, "").trim();
  if (/^(next|next step|neck|necks|nest|text|go on|go ahead|done|finished|okay next)$/.test(clean)) return "next";
  if (/^(previous|previous step|go back|back|last step|step back)$/.test(clean)) return "back";
  if (/^(repeat|repeat that|say that again|again|what)$/.test(clean)) return "repeat";
  if (/^(stuck|i'm stuck|im stuck|help|help me)$/.test(clean)) return "stuck";
  return text;
}

function handle(text) {
  if (!text) return;
  if (phase === "steps") text = normalizeCommand(text);
  if (!meantForKorjaa(text)) return;
  if (callOn) {
    if (EMERGENCY.test(text)) { endCall(); return send(text); }
    if (cardSteps.length) {
      const command = normalizeCommand(text);
      if (command === "next") return moveCard(1);
      if (command === "back") return moveCard(-1);
      if (command === "repeat") return speak(cardSteps[cardIndex]);
      if (/^(close|close this|got it|all done|thanks|thank you|cancel)$/i.test(text.replace(/[.,!?]/g, "").trim())) return closeCard();
      // With a card open, only a real question or update moves things on.
      if (!LIVE_ASK.test(text) || text.split(/\s+/).length < 3) return;
      return askCall(text);
    }
    if (COMMAND.test(text)) return whenIdle().then(() => send(text));
    return askCall(text);
  }
  manual = false;
  voiceTurn = true;
  awakeUntil = 0;
  if (!handsFree && !taskListening()) stopRecognition();
  updateVoiceUI();
  send(text);
}

/* Live camera: a video-call style view that sends a frame every few seconds and speaks or captions the next instruction */
async function openCallCamera() {
  callStream?.getTracks().forEach(track => track.stop());
  callStream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:callFacing, width:{ ideal:1920 }, height:{ ideal:1080 } } });
  callStream.getVideoTracks()[0]?.applyConstraints({ advanced:[{ focusMode:"continuous" }] }).catch(() => {});
  $("callVideo").srcObject = callStream;
  await $("callVideo").play().catch(() => {});
}

async function startCall() {
  await begin();
  closeMenu();
  if (callOn) return;
  try {
    await openCallCamera();
  } catch {
    return toast("Allow camera access to use live help");
  }
  interruptSpeech();
  callOn = true;
  callFound = "";
  $("call").hidden = false;
  $("callTag").textContent = "Looking…";
  $("callTag").classList.remove("found");
  $("callGuide").hidden = true;
  setCaption("Point the camera at what you need help with.");
  updateCallButtons();
  refreshVoice();
  callLoop();
}

function endCall() {
  if (!callOn) return;
  closeCard();
  callOn = false;
  callAsking = false;
  clearTimeout(interimTimer);
  liveAbort?.abort();
  callWake?.();
  callStream?.getTracks().forEach(track => track.stop());
  callStream = null;
  $("call").hidden = true;
  $("call").classList.remove("scanning");
  refreshVoice();
}

function setCaption(text, heard = "") {
  const el = $("callCaption");
  el.textContent = text;
  el.classList.remove("fade");
  void el.offsetWidth;
  el.classList.add("fade");
  $("callHeard").textContent = heard;
}

async function whenIdle() {
  for (let i = 0; busy && i < 100; i++) await new Promise(resolve => setTimeout(resolve, 150));
}

// A question runs one way: mic off, cancel any background look, answer, speak, then mic back on.
function askCall(text) {
  if (callAsking) return;
  $("heard").textContent = `You said: ${text}`;
  callAsking = true;
  clearTimeout(interimTimer);
  interimText = "";
  callQuestion = text;
  liveAbort?.abort();
  interruptSpeech();
  refreshVoice();
  setCaption("Got it. Looking now…", `You: ${text}`);
  $("cardNote").textContent = `You: ${text}. Looking now…`;
  callWake?.();
}

async function askLive(image, question, signal) {
  // One quiet retry, because the hosted model sometimes returns nothing.
  let result = null;
  for (let attempt = 0; attempt < (question ? 2 : 1); attempt++) {
    const response = await fetch("/api/live", { method:"POST", headers:{ "Content-Type":"application/json" }, body:JSON.stringify({ session_id:sessionId, image, question }), signal });
    if (!response.ok) throw new Error("live");
    result = await response.json();
    if (result.say || result.live_steps?.length) break;
  }
  return result;
}

function renderCard() {
  const total = cardSteps.length;
  $("cardCount").textContent = `Step ${cardIndex + 1} of ${total}`;
  $("cardSteps").replaceChildren(...cardSteps.map((text, index) => {
    const row = el("li", index === cardIndex ? "now" : index < cardIndex ? "done" : "", null, el("b", "", index + 1), el("span", "", text));
    return row;
  }));
  $("cardBack").disabled = cardIndex === 0;
  $("cardNext").textContent = cardIndex === total - 1 ? "Done" : "Next";
  $("cardSteps").children[cardIndex]?.scrollIntoView({ block:"nearest" });
}

function openCard(title, steps) {
  cardSteps = steps;
  cardIndex = 0;
  $("cardTitle").textContent = title || "Here's what to do";
  $("cardNote").textContent = "Ask me anything, or say next.";
  $("callCard").hidden = false;
  $("callCaptionBox").hidden = true;
  $("callGuide").hidden = true;
  renderCard();
}

function closeCard() {
  interimText = "";
  cardSteps = [];
  cardIndex = 0;
  $("callCard").hidden = true;
  $("callCaptionBox").hidden = false;
  liveLastSent = 0;
  liveSignature = null;
  callWake?.();
}

function moveCard(delta) {
  const target = cardIndex + delta;
  if (target < 0) return;
  if (target >= cardSteps.length) {
    closeCard();
    setCaption("Nice work. Ask me if you need anything else.");
    return speak("Nice work. Ask me if you need anything else.");
  }
  cardIndex = target;
  renderCard();
  speak(cardSteps[cardIndex]);
}

async function callLoop() {
  await new Promise(resolve => setTimeout(resolve, 1200));
  while (callOn) {
    // An open card waits for the user: no scans and no speech until they ask something.
    if (!busy && !speaking && (!cardSteps.length || callQuestion)) await scanFrame();
    if (callOn && !callQuestion) await new Promise(resolve => { callWake = resolve; setTimeout(resolve, LIVE_GAP_MS); });
  }
}

// The part of the video inside the on-screen guides, allowing for the video being cropped to fill the screen.
function guideArea(video) {
  const box = video.getBoundingClientRect();
  const scale = Math.max(box.width / video.videoWidth, box.height / video.videoHeight);
  const seenWidth = box.width / scale, seenHeight = box.height / scale;
  const left = (video.videoWidth - seenWidth) / 2, top = (video.videoHeight - seenHeight) / 2;
  return { x:left + seenWidth * .06, y:top + seenHeight * .14, width:seenWidth * .88, height:seenHeight * .56 };
}

function grayFrame(video, area, width, height) {
  const canvas = document.createElement("canvas");
  canvas.width = width;
  canvas.height = height;
  const context = canvas.getContext("2d", { willReadFrequently:true });
  context.drawImage(video, area.x, area.y, area.width, area.height, 0, 0, width, height);
  const { data } = context.getImageData(0, 0, width, height);
  const gray = new Float32Array(width * height);
  for (let i = 0; i < gray.length; i++) gray[i] = data[i * 4] * .3 + data[i * 4 + 1] * .59 + data[i * 4 + 2] * .11;
  return gray;
}

// Edge strength: a sharp frame has strong differences between neighbouring pixels.
function sharpness(video, area) {
  const width = 160, height = Math.max(40, Math.round(160 * area.height / area.width));
  const gray = grayFrame(video, area, width, height);
  let total = 0;
  for (let y = 1; y < height - 1; y++) {
    for (let x = 1; x < width - 1; x++) {
      const i = y * width + x;
      const edge = gray[i - 1] + gray[i + 1] + gray[i - width] + gray[i + width] - 4 * gray[i];
      total += edge * edge;
    }
  }
  return total;
}

function viewChanged(video, area) {
  const now = grayFrame(video, area, 32, 18);
  const before = liveSignature;
  liveSignature = now;
  if (!before) return true;
  let total = 0;
  for (let i = 0; i < now.length; i++) total += Math.abs(now[i] - before[i]);
  return total / now.length > LIVE_CHANGE;
}

async function sharpestFrame(video, area) {
  const scale = Math.min(1, LIVE_SIZE / area.width);
  const best = document.createElement("canvas");
  best.width = area.width * scale;
  best.height = area.height * scale;
  let top = -1;
  for (let shot = 0; shot < LIVE_SHOTS; shot++) {
    const score = sharpness(video, area);
    if (score > top) {
      top = score;
      best.getContext("2d").drawImage(video, area.x, area.y, area.width, area.height, 0, 0, best.width, best.height);
    }
    if (shot < LIVE_SHOTS - 1) await new Promise(resolve => setTimeout(resolve, LIVE_SHOT_GAP_MS));
  }
  return best.toDataURL("image/jpeg", .86).split(",")[1];
}

async function scanFrame() {
  const video = $("callVideo");
  if (!video.videoWidth) return;
  const area = guideArea(video);
  const question = callQuestion;
  // Nothing new to look at, so save the wait and the free quota.
  if (!viewChanged(video, area) && !question && Date.now() - liveLastSent < LIVE_REPEAT_MS) return;
  busy = true;
  $("call").classList.add("scanning");
  callQuestion = "";
  const controller = new AbortController();
  liveAbort = controller;
  const limit = setTimeout(() => controller.abort(), question ? 120000 : 30000);
  try {
    // A question sees the whole frame, as a photo does, so nothing outside the guides is cut off.
    const image = await sharpestFrame(video, question ? { x:0, y:0, width:video.videoWidth, height:video.videoHeight } : area);
    liveLastSent = Date.now();
    // The question is about this still picture, while the live preview keeps running behind it.
    if (question) {
      $("callThumb").src = `data:image/jpeg;base64,${image}`;
      $("callThumb").hidden = false;
    }
    const result = await askLive(image, question, controller.signal);
    if (!callOn) return;
    paint(result);
    if (result.seen) {
      callFound = [result.seen, result.problem].filter(Boolean).join(": ");
      $("callTag").textContent = [result.seen, result.problem].filter(Boolean).join(" · ");
      $("callTag").classList.add("found");
      $("callGuide").hidden = !["idle", "ended", "done"].includes(result.phase) || !!cardSteps.length;
    }
    busy = false;
    $("call").classList.remove("scanning");
    if (result.live_steps?.length) {
      openCard(result.live_title, result.live_steps);
      await speak(`${result.say} First, ${result.live_steps[0]}`);
    } else if (result.say) {
      setCaption(result.say, question ? `You: ${question}` : "");
      $("cardNote").textContent = result.say;
      await speak(result.say);
    } else if (question) {
      await callSorry();
    }
    if (result.phase === "stopped") endCall();
  } catch {
    if (callOn && question) await callSorry();
    else if (callOn && !controller.signal.aborted) setCaption("Connection problem. Trying again…");
  } finally {
    clearTimeout(limit);
    busy = false;
    $("call").classList.remove("scanning");
    if (question) {
      $("callThumb").hidden = true;
      callAsking = false;
      refreshVoice();
    }
  }
}

async function callSorry() {
  const line = "Sorry, I couldn't get an answer. Please ask me again.";
  setCaption(line);
  $("cardNote").textContent = line;
  busy = false;
  await speak(line);
}

function updateCallButtons() {
  $("callMic").setAttribute("aria-pressed", callMic && !!recognition);
  $("callVoice").setAttribute("aria-pressed", callVoice);
  $("callVoice").title = callVoice ? "Spoken answers on" : "Text only";
  updateVoiceUI();
}

function chime() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
  osc.frequency.setValueAtTime(660, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(990, audioCtx.currentTime + .12);
  gain.gain.setValueAtTime(.0001, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(.15, audioCtx.currentTime + .02);
  gain.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + .25);
  osc.connect(gain).connect(audioCtx.destination);
  osc.start();
  osc.stop(audioCtx.currentTime + .26);
}

async function updateWakeLock() {
  const active = handsFree || ["caution","items","gate","steps"].includes(phase);
  try {
    if (active && !wakeLock && "wakeLock" in navigator) wakeLock = await navigator.wakeLock.request("screen");
    if (!active && wakeLock) { await wakeLock.release(); wakeLock = null; }
  } catch {}
}

async function shrink(file) {
  const bitmap = await createImageBitmap(file);
  const canvas = document.createElement("canvas");
  const scale = Math.min(1, 1600 / Math.max(bitmap.width, bitmap.height));
  canvas.width = bitmap.width * scale;
  canvas.height = bitmap.height * scale;
  canvas.getContext("2d").drawImage(bitmap, 0, 0, canvas.width, canvas.height);
  bitmap.close();
  return canvas.toDataURL("image/jpeg", 0.85).split(",")[1];
}

function renderAttachments() {
  $("attachments").hidden = !staged.length;
  $("attachments").replaceChildren(...staged.map((data, index) => {
    const image = Object.assign(new Image(), { src:`data:image/jpeg;base64,${data}`, alt:`Photo ${index + 1}` });
    const remove = el("button", "", "\u00d7");
    remove.type = "button";
    remove.setAttribute("aria-label", `Remove photo ${index + 1}`);
    remove.onclick = () => { staged.splice(index, 1); renderAttachments(); };
    return el("div", "att", null, image, remove);
  }));
  $("text").placeholder = staged.length ? "What should I do with these?" : "Describe the problem…";
  updateSend();
}

function updateSend() {
  $("sendBtn").disabled = !$("text").value.trim() && !staged.length;
}

function showSent(images, text) {
  $("actions").replaceChildren();
  $("items").replaceChildren();
  $("extra").replaceChildren(el("div", "sent", null,
    el("div", "sent-photos", null, ...images.map(data => Object.assign(new Image(), { src:`data:image/jpeg;base64,${data}`, alt:"Your photo" }))),
    ...(text ? [el("p", "sent-text", text)] : [])));
}

function stageImages(images) {
  staged.push(...images);
  renderAttachments();
  $("text").focus();
}

async function uploadPhotos(files) {
  if (busy || !files.length) return;
  await begin();
  if (phase === "steps") return toast("Use Check this to compare a photo with this step.");
  const room = 6 - (last?.photo_count || 0) - staged.length;
  if (room <= 0) return toast("You can add up to 6 photos.");
  try {
    stageImages(await Promise.all([...files].slice(0, room).map(shrink)));
  } catch {
    toast("Those photos couldn't be read. Try again.");
  }
}

async function submitPhotos(text) {
  if (busy) return;
  const id = ++requestId;
  const images = staged.slice();
  // The message is sent now, so the photos leave the box and move into the conversation.
  staged = [];
  renderAttachments();
  showSent(images, text);
  busy = true;
  interruptSpeech();
  setStatus("Reading your photos", "busy");
  setOrb("busy");
  setScreen("Looking at your photos…", true);
  try {
    const result = await (await post("/api/photos", { session_id:sessionId, images })).json();
    if (id !== requestId) return;
    busy = false;
    if (result.phase === "idle" && result.say.startsWith("I couldn't")) {
      staged = images;
      renderAttachments();
      return await render(result);
    }
    if (result.phase !== "idle") return await render(result);
    last = result;
    await send(text || `Help me with ${result.product || "the items in my photos"}`);
  } catch {
    if (id !== requestId) return;
    busy = false;
    staged = images;
    renderAttachments();
    if (last) paint(last); else { $("extra").replaceChildren(); renderActions(); }
    setOrb("idle");
    setScreen("Photo upload failed. Try again.");
    setStatus("Photo upload failed. Try again.", "error");
  }
  updateVoiceUI();
}

async function capture() {
  let stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video:{ facingMode:"environment" } });
    const video = $("video"), canvas = $("canvas"), count = $("countdown");
    video.srcObject = stream;
    $("camera").hidden = false;
    for (const n of [3, 2, 1]) {
      count.textContent = n;
      count.classList.remove("tick");
      void count.offsetWidth;
      count.classList.add("tick");
      await new Promise(resolve => setTimeout(resolve, 1000));
    }
    count.textContent = "";
    const scale = Math.min(1, 1024 / video.videoWidth);
    canvas.width = video.videoWidth * scale;
    canvas.height = video.videoHeight * scale;
    canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
    const image = canvas.toDataURL("image/jpeg", 0.8).split(",")[1];
    stream.getTracks().forEach(track => track.stop());
    $("camera").hidden = true;
    if (phase !== "steps") return stageImages([image]);
    setStatus("Checking photo", "busy");
    setOrb("busy");
    await render(await (await post("/api/vision", { session_id:sessionId, image })).json());
  } catch {
    $("camera").hidden = true;
    await speak("I couldn't take a photo. Check camera permission and try again.");
  } finally {
    stream?.getTracks().forEach(track => track.stop());
    $("camera").hidden = true;
  }
}

function closeMenu() {
  $("menu").hidden = true;
  $("plus").setAttribute("aria-expanded", "false");
}

$("start").onclick = async () => {
  await begin();
  const hint = handsFree ? " Say hey buddy any time." : "";
  setScreen("What do you need help with?");
  await speak(`What do you need help with?${hint}`);
  if (recognition && !handsFree) { manual = true; refreshVoice(); }
};
$("stop").onclick = () => {
  interruptSpeech();
  closeShop();
  send("stop");
};
$("scrim").onclick = closeShop;
$("timer").onclick = () => setTimer(0);
document.addEventListener("keydown", event => { if (event.key === "Escape") closeShop(); });
$("menuLive").onclick = () => startCall();
$("cardNext").onclick = () => { interruptSpeech(); moveCard(1); };
$("cardBack").onclick = () => { interruptSpeech(); moveCard(-1); };
$("cardClose").onclick = () => { interruptSpeech(); closeCard(); };
$("callEnd").onclick = () => { interruptSpeech(); endCall(); };
$("callStop").onclick = () => { interruptSpeech(); endCall(); $("stop").onclick(); };
$("callScan").onclick = () => { interruptSpeech(); askCall("What should I do next?"); };
$("callFlip").onclick = async () => {
  callFacing = callFacing === "environment" ? "user" : "environment";
  try { await openCallCamera(); } catch { toast("Couldn't switch camera"); }
};
$("callMic").onclick = () => {
  if (!recognition) return toast("Voice isn't supported in this browser. Try Chrome.");
  callMic = !callMic;
  updateCallButtons();
  refreshVoice();
};
$("callVoice").onclick = () => {
  callVoice = !callVoice;
  if (!callVoice) interruptSpeech();
  try { localStorage.setItem("korjaa-call-voice", callVoice ? "1" : "0"); } catch {}
  toast(callVoice ? "Spoken answers on" : "Text only: answers appear as captions");
  updateCallButtons();
};
$("callGuide").onclick = () => {
  const text = `Help me with ${callFound}`;
  interruptSpeech();
  endCall();
  send(text);
};
$("handsfree").onclick = async () => {
  if (!Recognition) return toast("Voice isn't supported in this browser");
  await begin();
  handsFree = !handsFree;
  try { localStorage.setItem("korjaa-handsfree", handsFree ? "1" : "0"); } catch {}
  toast(handsFree ? "Hands-free on: say “hey buddy”" : "Hands-free off");
  if (!handsFree) awakeUntil = 0;
  updateWakeLock();
  refreshVoice();
};
$("mic").onclick = async () => {
  if (!Recognition) return toast("Voice isn't supported in this browser. Try Chrome.");
  await begin();
  if (isAwake() && recActive && !speaking) {
    manual = false;
    awakeUntil = 0;
    micPaused = true;
    if (!handsFree) stopRecognition();
    toast("Mic paused. Tap it to listen again.");
  } else {
    if (speaking) { interruptSpeech(); }
    micPaused = false;
    manual = !taskListening();
    chime();
  }
  refreshVoice();
};
$("plus").onclick = () => {
  const open = $("menu").hidden;
  $("menu").hidden = !open;
  $("plus").setAttribute("aria-expanded", open);
};
document.addEventListener("click", event => { if (!$("typed").contains(event.target)) closeMenu(); });
document.querySelectorAll("[data-cmd]").forEach(button => button.onclick = () => send(button.dataset.cmd));
$("addPhotos").onclick = () => { closeMenu(); $("photos").click(); };
$("photos").onchange = async event => {
  await uploadPhotos(event.target.files);
  event.target.value = "";
};
$("text").oninput = updateSend;
$("text").onpaste = event => {
  const files = [...event.clipboardData.files].filter(file => file.type.startsWith("image/"));
  if (files.length) { event.preventDefault(); uploadPhotos(files); }
};
$("typed").onsubmit = event => {
  event.preventDefault();
  const text = $("text").value.trim();
  if (!text && !staged.length) return;
  $("text").value = "";
  updateSend();
  staged.length ? send(text || "") : send(text);
};
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") { wakeLock = null; updateWakeLock(); refreshVoice(); }
});
$("handsfree").setAttribute("aria-pressed", handsFree);
renderActions();
</script>
</body>
</html>
